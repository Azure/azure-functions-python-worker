        pythonVersion: '3.10'
        normalizedPythonVersion: '3.10'
      Python311V4:
        pythonVersion: '3.11'
        normalizedPythonVersion: '3.11'
      Python312V4:
        pythonVersion: '3.12'
        normalizedPythonVersion: '3.12'
      Python313V4:
