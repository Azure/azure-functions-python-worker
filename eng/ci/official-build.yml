trigger:
  batch: true
  branches:
    include:
      - dev-3*
      - library-release/*

# CI only, does not trigger on PRs.
pr: none

schedules:
  - cron: '0 0 * * MON'
    displayName: At 12:00 AM, only on Monday
    branches:
      include:
        - dev-3*
    always: true

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release

variables:
  - name: codeql.excludePathPatterns
    value: deps/,build/

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows
    sdl:
      codeSignValidation:
        enabled: true
        break: true

    stages:
      - stage: Build
        jobs:
          - template: /eng/templates/official/jobs/build-artifacts.yml@self
      - stage: RunUnitTests
        dependsOn: Build
        jobs:
          - template: /eng/templates/jobs/ci-unit-tests.yml@self
