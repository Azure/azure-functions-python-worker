parameters:
  pythonVersion: ''
  artifactName: ''
  workerPath: ''

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: ${{ parameters.pythonVersion }}
    addToPath: true
- task: ShellScript@2
  inputs:
    disableAutoCwd: true
    scriptPath: 'pack/scripts/mac_arm64_deps.sh'
    args: '${{ parameters.pythonVersion }}'
  displayName: 'Install Dependencies'
- bash: |
    pip install pip-audit
    pip-audit -r requirements.txt
  displayName: 'Run vulnerability scan'
  condition: ne(variables['pythonVersion'], '3.7')
- task: CopyFiles@2
  inputs:
    contents: |
      ${{ parameters.workerPath }}
    targetFolder: '$(Build.ArtifactStagingDirectory)'
    flattenFolders: true
- task: CopyFiles@2
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)/deps'
    contents: |
      **
      !grpc_tools/**/*
      !grpcio_tools*/*
      !build/**
      !docs/**
      !pack/**
      !python/**
      !tests/**
      !setuptools*/**
      !_distutils_hack/**
      !distutils-precedence.pth
      !pkg_resources/**
      !*.dist-info/**
      !werkzeug/debug/shared/debugger.js
      !proxy_worker/**
    targetFolder: '$(Build.ArtifactStagingDirectory)'
  condition: lt(variables['pythonVersion'], '3.13')
  displayName: 'Copy azure_functions_worker files'
- task: CopyFiles@2
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)/deps'
    contents: |
      **
      !grpc_tools/**/*
      !grpcio_tools*/*
      !build/**
      !docs/**
      !pack/**
      !python/**
      !tests/**
      !setuptools*/**
      !_distutils_hack/**
      !distutils-precedence.pth
      !pkg_resources/**
      !*.dist-info/**
      !werkzeug/debug/shared/debugger.js
      !azure_functions_worker/**
      !dateutil/**
    targetFolder: '$(Build.ArtifactStagingDirectory)'
  condition: ge(variables['pythonVersion'], '3.13')
  displayName: 'Copy proxy_worker files'
