parameters:
  PROJECT_DIRECTORY: 'workers'
  ArtifactFeed: ''
  NuGetServiceConnection: ''

jobs:
  - job: "TestPython"
    displayName: "Run Python Emulator Tests"

    pool:
      name: ${{ parameters.PoolName }}
      image: 1es-ubuntu-22.04
      os: linux

    strategy:
      matrix:
        Python39:
          PYTHON_VERSION: '3.9'
        Python310:
          PYTHON_VERSION: '3.10'
        Python311:
          PYTHON_VERSION: '3.11'
        Python312:
          PYTHON_VERSION: '3.12'
        Python313:
          PYTHON_VERSION: '3.13'
        Python314:
          PYTHON_VERSION: '3.14'
    steps:
      - bash: |
          echo "Disk space before cleanup:"
          df -h
          
          # Clean up Docker resources
          docker system prune -af --volumes || true
          
          # Clean pip cache
          pip cache purge || true
          
          # Clean apt cache
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          
          echo "Disk space after cleanup:"
          df -h
        displayName: 'Free disk space'
        
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(PYTHON_VERSION)
      - task: PipAuthenticate@1
        displayName: 'Pip Authenticate'
        inputs:
          artifactFeeds: ${{ parameters.ArtifactFeed }}
      - task: UseDotNet@2
        displayName: 'Install .NET 10'
        inputs:
          version: 10.0.x
      - task: NuGetAuthenticate@1
        displayName: 'NuGet Authenticate'
      - bash: |
          # Remove the feed that doesn't match the current service connection
          if [[ "${{ parameters.NuGetServiceConnection }}" == "PythonWorker_PublicPackages" ]]; then
            # Remove internal feed for public builds
            sed -i '/_Internal_PublicPackages/d' nuget.config
          else
            # Remove public feed for internal builds
            sed -i '/PythonWorker_PublicPackages[^_]/d' nuget.config
          fi
          echo "Updated nuget.config:"
          cat nuget.config
        displayName: 'Configure NuGet feed for current organization'
      - bash: |
          chmod +x eng/scripts/install-dependencies.sh
          chmod +x eng/scripts/test-setup.sh

          eng/scripts/install-dependencies.sh $(PYTHON_VERSION) ${{ parameters.PROJECT_DIRECTORY }}
          eng/scripts/test-setup.sh
        displayName: 'Install dependencies and the worker'
        condition: and(eq(variables.isSdkRelease, false), eq(variables.isExtensionsRelease, false), eq(variables['USETESTPYTHONSDK'], false), eq(variables['USETESTPYTHONEXTENSIONS'], false))
      - task: DownloadPipelineArtifact@2
        displayName: 'Download Python SDK Artifact'
        inputs:
          buildType: specific
          artifactName: 'azure-functions'
          project: 'internal'
          definition: 679
          buildVersionToDownload: latest
          targetPath: '$(Pipeline.Workspace)/PythonSdkArtifact'
        condition: or(eq(variables.isSdkRelease, true), eq(variables['USETESTPYTHONSDK'], true))
      - bash: |
          chmod +x eng/scripts/test-sdk.sh
          chmod +x eng/scripts/test-setup.sh

          eng/scripts/test-sdk.sh $(Pipeline.Workspace) $(PYTHON_VERSION)
          eng/scripts/test-setup.sh
        displayName: 'Install test python sdk, dependencies and the worker'
        condition: or(eq(variables.isSdkRelease, true), eq(variables['USETESTPYTHONSDK'], true))
      - task: DownloadPipelineArtifact@2
        displayName: 'Download Python Extension Artifact'
        inputs:
          buildType: specific
          artifactName: $(PYTHONEXTENSIONNAME)
          project: 'internal'
          definition: 798
          buildVersionToDownload: latest
          targetPath: '$(Pipeline.Workspace)/PythonExtensionArtifact'
        condition: or(eq(variables.isExtensionsRelease, true), eq(variables['USETESTPYTHONEXTENSIONS'], true))
      - bash: |
          chmod +x eng/scripts/test-setup.sh
          chmod +x eng/scripts/test-extensions.sh

          eng/scripts/test-extensions.sh $(Pipeline.Workspace) $(PYTHON_VERSION) $(PYTHONEXTENSIONNAME)
          eng/scripts/test-setup.sh
        displayName: 'Install test python extension, dependencies and the worker'
        condition: or(eq(variables.isExtensionsRelease, true), eq(variables['USETESTPYTHONEXTENSIONS'], true))
      - bash: |
          # Clean up Docker resources to free disk space
          docker system prune -af --volumes
          df -h
          
          docker pull mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
          docker run --detach --publish 8081:8081 --publish 1234:1234 mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
          docker ps
        displayName: "Start CosmosDB Emulator"
      - bash: |
          docker compose -f ${{ parameters.PROJECT_DIRECTORY }}/tests/emulator_tests/utils/eventhub/docker-compose.yml pull
          docker compose -f ${{ parameters.PROJECT_DIRECTORY }}/tests/emulator_tests/utils/eventhub/docker-compose.yml up -d
        displayName: 'Install Azurite and Start EventHub Emulator'
      - bash: |
            python -m pytest -q --dist loadfile --reruns 4 --ignore=tests/emulator_tests/test_servicebus_functions.py tests/emulator_tests
        env:
          AzureWebJobsStorage: $(AzureWebJobsStorage)
          AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
          AzureWebJobsEventHubConnectionString: $(EmulatorEventHubConnectionString)
          AzureWebJobsCosmosDBConnectionString: $(EmulatorCosmosDBConnectionString)
          CosmosDBEmulatorUrl: $(CosmosDBEmulatorUrl)
          CosmosDBEmulatorKey: $(CosmosDBEmulatorKey)
        workingDirectory: $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}
        displayName: "Running $(PYTHON_VERSION) Python Linux Emulator Tests"
      - bash: |
          # Stop and remove EventHub Emulator container to free up the port
          docker stop eventhubs-emulator
          docker container rm --force eventhubs-emulator
          docker compose -f ${{ parameters.PROJECT_DIRECTORY }}/tests/emulator_tests/utils/servicebus/docker-compose.yml pull
          docker compose -f ${{ parameters.PROJECT_DIRECTORY }}/tests/emulator_tests/utils/servicebus/docker-compose.yml up -d
        env:
          AzureWebJobsSQLPassword: $(AzureWebJobsSQLPassword)
        displayName: 'Install Azurite and Start ServiceBus Emulator'
      - bash: |
            export PYTHONPATH="$(Build.SourcesDirectory)/servicebus_dir:$PYTHONPATH"
            python -m pytest -q --dist loadfile --reruns 4 tests/emulator_tests/test_servicebus_functions.py
        env:
          AzureWebJobsStorage: $(AzureWebJobsStorage)
          AzureWebJobsServiceBusConnectionString: $(EmulatorServiceBusConnectionString)
          AzureWebJobsServiceBusSDKConnectionString: $(AzureWebJobsServiceBusSDKConnectionString)
        workingDirectory: $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}
        displayName: "Running $(PYTHON_VERSION) Python ServiceBus Linux Emulator Tests"
      
      - bash: |
          echo "Cleaning up after tests..."
          # Stop and remove all Docker containers
          docker stop $(docker ps -aq) || true
          docker rm $(docker ps -aq) || true
          
          # Remove build artifacts and caches
          rm -rf $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}/build || true
          rm -rf $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}/.pytest_cache || true
          rm -rf $(Pipeline.Workspace)/PythonSdkArtifact || true
          rm -rf $(Pipeline.Workspace)/PythonExtensionArtifact || true
          
          # Clean Docker resources
          docker system prune -af --volumes || true
          
          # Clean pip cache
          pip cache purge || true
          
          echo "Disk space after cleanup:"
          df -h
        displayName: 'Cleanup after tests'
        condition: always()
