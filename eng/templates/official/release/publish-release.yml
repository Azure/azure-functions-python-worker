parameters:
  - name: libraryVersion
    type: string
  - name: projectDisplayName
    type: string
    default: 'Azure Functions Runtime'
    displayName: 'Human-readable project name for release notes'
  - name: releaseBranchPrefix
    type: string
    default: 'release'
    displayName: 'Prefix for release branch (e.g., release or release-v2)'
  - name: tagPrefix
    type: string
    default: ''
    displayName: 'Optional prefix for git tags (e.g., runtimes/v2-)'
  - name: githubOrg
    type: string
    default: 'Azure'
    displayName: 'GitHub organization that owns the source repository'
  - name: githubRepo
    type: string
    default: 'azure-functions-python-worker'
    displayName: 'GitHub repository name (used in URLs and as the local clone folder)'
  - name: artifactName
    type: string
    default: 'azure-functions-runtime'
    displayName: 'Pipeline artifact name produced by the Build stage'
  - name: esrpOwners
    type: string
    default: '$(EsrpOwners)'
  - name: esrpApprovers
    type: string
    default: '$(EsrpApprovers)'
  - name: esrpManualApprovers
    type: string
    default: '$(EsrpManualApprovers)'

jobs:
  - job: "CreateReleaseTag"
    displayName: 'Create Release Tag'
    steps:
    - powershell: |
        $githubUser = "$(GithubUser)"
        $githubToken = "$(GithubPat)"
        $newLibraryVersion = "${{ parameters.libraryVersion }}"
        $releaseBranchPrefix = "${{ parameters.releaseBranchPrefix }}"
        $tagPrefix = "${{ parameters.tagPrefix }}"
        $releaseTag = "${tagPrefix}${newLibraryVersion}"

        # Create GitHub credential
        git config --global user.name "AzureFunctions"
        git config --global user.email "azurefunctions@microsoft.com"

        # Clone Repository
        git clone "https://${githubUser}:${githubToken}@github.com/${{ parameters.githubOrg }}/${{ parameters.githubRepo }}"
        Write-Host "Cloned ${{ parameters.githubRepo }} into local"
        Set-Location "${{ parameters.githubRepo }}"
        git checkout "origin/${releaseBranchPrefix}/$newLibraryVersion"

        # Create release tag
        Write-Host "Creating release tag $releaseTag"
        git tag -a "$releaseTag" -m "$newLibraryVersion"

        # Push tag to remote
        git push origin $releaseTag
      displayName: 'Tag and push ${{ parameters.tagPrefix }}x.y.z'
      
    - download: current
      artifact: ${{ parameters.artifactName }}
      displayName: 'Download build artifacts'

    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'

        $githubUser = "$(GithubUser)"
        $githubToken = "$(GithubPat)"
        $newLibraryVersion = "${{ parameters.libraryVersion }}"
        $tagPrefix = "${{ parameters.tagPrefix }}"
        $releaseTag = "${tagPrefix}${newLibraryVersion}"
        $projectDisplayName = "${{ parameters.projectDisplayName }}"

        $credential = [System.Convert]::ToBase64String(
            [System.Text.Encoding]::ASCII.GetBytes("${githubUser}:${githubToken}"))

        $apiHeaders = @{
            "Accept"               = "application/vnd.github+json"
            "Authorization"        = "Basic $credential"
            "X-GitHub-Api-Version" = "2022-11-28"
            "Content-Type"         = "application/json"
        }

        # ---- Locate and validate assets BEFORE creating the release ----
        $distFolder = Join-Path '$(Pipeline.Workspace)' (Join-Path '${{ parameters.artifactName }}' 'dist')
        if (-not (Test-Path -LiteralPath $distFolder)) {
            throw "Distribution folder not found: $distFolder"
        }

        $assetsToUpload = @(
            Get-ChildItem -LiteralPath $distFolder -File |
                Where-Object { $_.Name -like '*.whl' -or $_.Name -like '*.tar.gz' } |
                Sort-Object Name
        )
        if ($assetsToUpload.Count -eq 0) {
            throw "No .whl or .tar.gz files found in $distFolder"
        }
        Write-Host "Assets to upload:"
        $assetsToUpload | ForEach-Object { Write-Host "  - $($_.Name) ($($_.Length) bytes)" }

        # ---- Create draft release ----
        Write-Host "Creating GitHub draft release for $releaseTag"
        $releaseName = "Release ${projectDisplayName} ${newLibraryVersion}"
        $body = (@{tag_name="$releaseTag";name="$releaseName";body="- Fill in Release Note Here";draft=$true} | ConvertTo-Json -Compress)
        $createResponse = Invoke-WebRequest -Headers $apiHeaders -Method Post -Body "$body" `
            -Uri "https://api.github.com/repos/${{ parameters.githubOrg }}/${{ parameters.githubRepo }}/releases"
        if ($createResponse.StatusCode -ne 201) {
            throw "Failed to create release. HTTP $($createResponse.StatusCode)"
        }
        $release = $createResponse.Content | ConvertFrom-Json
        Write-Host "Draft release created: $($release.html_url)"

        # ---- Upload assets; fail hard on duplicate-name (PyPI-style) ----
        $uploadUrlBase = $release.upload_url -replace '\{\?name,label\}$', ''
        $uploadHeaders = @{
            "Accept"               = "application/vnd.github+json"
            "Authorization"        = "Basic $credential"
            "X-GitHub-Api-Version" = "2022-11-28"
        }

        # Wrap upload loop so any failure deletes the incomplete draft release.
        # This keeps the world clean for retries: an operator can rerun the job
        # without manually purging a stranded empty/partial draft.
        try {
            foreach ($asset in $assetsToUpload) {
                $assetUploadUrl = '{0}?name={1}' -f $uploadUrlBase, [System.Uri]::EscapeDataString($asset.Name)
                Write-Host "Uploading $($asset.Name)..."
                try {
                    $uploadResponse = Invoke-WebRequest -Headers $uploadHeaders -Method Post `
                        -Uri $assetUploadUrl -ContentType 'application/octet-stream' -InFile $asset.FullName
                } catch {
                    $status = $null
                    if ($_.Exception.Response) {
                        $status = [int]$_.Exception.Response.StatusCode
                    }
                    if ($status -eq 422) {
                        throw "Asset '$($asset.Name)' already exists on release $newLibraryVersion. GitHub releases must be unique per filename (same policy as PyPI). If this is intentional, delete the asset from the GitHub release UI and rerun, or bump the version."
                    }
                    throw "Upload failed for $($asset.Name): HTTP $status - $($_.Exception.Message)"
                }
                if ($uploadResponse.StatusCode -ne 201) {
                    throw "Upload failed for $($asset.Name). HTTP $($uploadResponse.StatusCode)"
                }
                Write-Host "  -> uploaded"
            }
        } catch {
            $uploadError = $_
            if ($release -and $release.id) {
                $releaseDeleteUri = "https://api.github.com/repos/${{ parameters.githubOrg }}/${{ parameters.githubRepo }}/releases/$($release.id)"
                Write-Host "##[warning]Asset upload failed. Cleaning up incomplete draft release $($release.id)..."
                try {
                    Invoke-WebRequest -Headers $apiHeaders -Method Delete -Uri $releaseDeleteUri | Out-Null
                    Write-Host "Draft release $($release.id) deleted."
                } catch {
                    Write-Host "##[warning]Failed to delete draft release $($release.id): $($_.Exception.Message). Manual cleanup required at https://github.com/${{ parameters.githubOrg }}/${{ parameters.githubRepo }}/releases"
                }
            }
            throw $uploadError
        }

        Write-Host "All assets attached to draft release: $($release.html_url)"
      displayName: 'Create GitHub release draft and attach assets'

  - job: "CheckGitHubRelease"
    dependsOn: ['CreateReleaseTag']
    displayName: '(Manual) Check GitHub release note'
    pool: server
    steps:
    - task: ManualValidation@1
      displayName: 'Write GitHub release note'
      inputs:
        notifyUsers: ''
        instructions: 'Please head to https://github.com/${{ parameters.githubOrg }}/${{ parameters.githubRepo }}/releases to finish the release note'

  - job: ESRPApproval
    dependsOn: ['CheckGitHubRelease']
    displayName: 'Approve PyPI release'
    timeoutInMinutes: 1440
    pool: server
    steps:
      - task: ManualValidation@1
        inputs:
          notifyUsers: ''
          approvers: '${{ parameters.esrpManualApprovers }}'
          allowApproversToApproveTheirOwnRuns: false
          instructions: 'Approve publishing the Python package to PyPI through ESRP.'

  - job: ESRPRelease
    dependsOn: ESRPApproval
    displayName: 'Publish package to PyPI with ESRP'
    templateContext:
      type: releaseJob
      isProduction: true
      inputs:
        - input: pipelineArtifact
          artifactName: ${{ parameters.artifactName }}
          targetPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}
    pool:
      name: 1es-pool-azfunc
      image: 1es-ubuntu-22.04
      os: linux
    steps:
      - checkout: none
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $distFolder = '$(Pipeline.Workspace)/${{ parameters.artifactName }}/dist'
          # Runtime artifact names match their PyPI project names for V1 and V2.
          $packageName = '${{ parameters.artifactName }}'
          $libraryVersion = '${{ parameters.libraryVersion }}'

          if (-not (Test-Path -LiteralPath $distFolder -PathType Container)) {
              throw "Distribution folder not found: $distFolder"
          }

          $wheels = @(Get-ChildItem -LiteralPath $distFolder -File -Filter '*.whl')
          $sourceDistributions = @(Get-ChildItem -LiteralPath $distFolder -File -Filter '*.tar.gz')
          $unsupportedFiles = @(
              Get-ChildItem -LiteralPath $distFolder -File |
                  Where-Object { $_.Name -notlike '*.whl' -and $_.Name -notlike '*.tar.gz' }
          )

          if ($wheels.Count -ne 1 -or $sourceDistributions.Count -ne 1) {
              throw "Expected one wheel and one source distribution in $distFolder; found $($wheels.Count) wheel(s) and $($sourceDistributions.Count) source distribution(s)."
          }
          if ($unsupportedFiles.Count -ne 0) {
              throw "Unexpected files found in the ESRP package folder: $($unsupportedFiles.Name -join ', ')"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($wheels[0].FullName)
          try {
              $metadataEntry = $archive.Entries |
                  Where-Object { $_.FullName -like '*.dist-info/METADATA' } |
                  Select-Object -First 1
              if (-not $metadataEntry) {
                  throw "Wheel metadata was not found in $($wheels[0].Name)."
              }

              $reader = [System.IO.StreamReader]::new($metadataEntry.Open())
              try {
                  $metadata = $reader.ReadToEnd()
              } finally {
                  $reader.Dispose()
              }
          } finally {
              $archive.Dispose()
          }

          $actualName = [regex]::Match($metadata, '(?m)^Name:\s*(.+)\r?$').Groups[1].Value.Trim()
          $actualVersion = [regex]::Match($metadata, '(?m)^Version:\s*(.+)\r?$').Groups[1].Value.Trim()
          if ($actualName -ne $packageName -or $actualVersion -ne $libraryVersion) {
              throw "Artifact metadata mismatch. Expected $packageName $libraryVersion; found $actualName $actualVersion."
          }

          Write-Host "Validated ESRP release contents for $packageName ${libraryVersion}:"
          Write-Host "  - $($wheels[0].Name)"
          Write-Host "  - $($sourceDistributions[0].Name)"
        displayName: 'Validate ESRP package contents'

      - template: /ci/internal/publish-pypi-esrp.yml@eng
        parameters:
          folderLocation: '$(Pipeline.Workspace)/${{ parameters.artifactName }}/dist'
          owners: ${{ parameters.esrpOwners }}
          approvers: ${{ parameters.esrpApprovers }}
          displayName: 'ESRP Release ${{ parameters.artifactName }} ${{ parameters.libraryVersion }}'
