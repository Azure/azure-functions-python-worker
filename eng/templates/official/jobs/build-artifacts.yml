- job: PackageWorkers
  dependsOn: ['Build_WINDOWS_X64', 'Build_WINDOWS_X86', 'Build_LINUX_X64', 'Build_R2P2_LINUX_X64', 'Build_R2P2_WINDOWS_X64', 'Build_R2P2_WINDOWS_ARM64', 'Build_R2P2_OSX_X64', 'Build_R2P2_OSX_ARM64', 'Build_OSX_X64', 'Build_OSX_ARM64', 'Build_LINUX_ARM64']
  templateContext:
      outputParentDirectory: $(Build.ArtifactStagingDirectory)
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)
          artifactName: "PythonWorker"
  steps:
  - bash: |
      echo "Releasing from $BUILD_SOURCEBRANCHNAME"
      sudo apt-get install -y jq

      if [[ $BUILD_SOURCEBRANCHNAME = 4\.* ]]
      then
        echo "Generating V4 Release Package for $BUILD_SOURCEBRANCHNAME"
        NUSPEC="eng\pack\Microsoft.Azure.Functions.V4.PythonWorker.nuspec"
        WKVERSION="$BUILD_SOURCEBRANCHNAME"
      elif [[ $BUILD_SOURCEBRANCHNAME = dev ]]
      then
        echo "Generating V4 Integration Test Package for $BUILD_SOURCEBRANCHNAME"
        VERSION=$(cat workers/azure_functions_worker/version.py | tail -1 | cut -d' ' -f3 | sed  "s/'//g")
        NUSPEC="eng\pack\Microsoft.Azure.Functions.V4.PythonWorker.nuspec"
        WKVERSION="$VERSION-$(Build.BuildNumber)"
      else
        # this is only to test nuget related workflow because we are setting nuspec here
        echo "Generating Integration Test Package for $BUILD_SOURCEBRANCHNAME for testing purpose"
        # Pick the latest *worker* release tag (numeric semver like 4.35.1). The
        # repo also carries runtimes/v2-* and runtimes/v1-* tags, which contain a
        # '/' and are not valid NuGet versions, so they must be filtered out.
        LATEST_TAG=$(curl -s https://api.github.com/repos/Azure/azure-functions-python-worker/tags | jq -r '[.[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]' | cut -d'.' -f-2)
        NUSPEC="eng\pack\Microsoft.Azure.Functions.V4.PythonWorker.nuspec"
        # Only required for Integration Test. Version number contains build id (e.g. 3.4.35-1234-TEST)
        WKVERSION="3.$LATEST_TAG-$(Build.BuildId)-TEST"
        echo "No Matching Release Tag For $BUILD_SOURCEBRANCH"
      fi

      echo "##vso[task.setvariable variable=nuspec_path]$NUSPEC"
      echo "##vso[task.setvariable variable=worker_version]$WKVERSION"
    displayName: "Generate Worker NuGet Package for Release $BUILD_SOURCEBRANCHNAME"
  - task: DownloadPipelineArtifact@2
    inputs:
      buildType: 'current'
      targetPath: '$(Build.SourcesDirectory)'
  - task: ManifestGeneratorTask@0
    displayName: 'SBOM Generation Task'
    inputs:
      BuildDropPath: '$(Build.ArtifactStagingDirectory)'
      BuildComponentPath: '$(Build.SourcesDirectory)'
      Verbosity: 'Verbose'
  - task: CopyFiles@2
    inputs:
      SourceFolder: '$(Build.ArtifactStagingDirectory)'
      Contents: '**'
      TargetFolder: '$(Build.SourcesDirectory)'
  - task: NuGetCommand@2
    inputs:
      command: pack
      packagesToPack: '$(nuspec_path)'
      packDestination: $(Build.ArtifactStagingDirectory) 
      versioningScheme: 'byEnvVar'
      versionEnvVar: WORKER_VERSION
