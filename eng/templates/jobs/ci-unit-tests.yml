parameters:
  PROJECT_DIRECTORY: 'workers'
  CARGO_CONFIG_FILE: 'workers/r2p2/.cargo/config.toml'

jobs:
  - job: "TestPython"
    displayName: "Run Python Unit Tests"

    pool:
      name: ${{ parameters.PoolName }}
      image: 1es-ubuntu-24.04-min
      os: linux
    
    strategy:
      matrix:
        Python310:
          PYTHON_VERSION: '3.10'
        Python311:
          PYTHON_VERSION: '3.11'
        Python312:
          PYTHON_VERSION: '3.12'
        Python313:
          PYTHON_VERSION: '3.13'
        Python314:
          PYTHON_VERSION: '3.14'
        Python315:
          PYTHON_VERSION: '3.15.0-rc.1'
          R2P2_WORKER: 'true'
    steps:
      - task: PipAuthenticate@1
        displayName: 'Authenticate pip to CFS'
        inputs:
          artifactFeeds: 'public/upstream-public'
          onlyAddExtraIndex: false
      - bash: |
          echo "Disk space before cleanup:"
          df -h
          
          # Clean up Docker resources
          docker system prune -af --volumes || true
          
          # Clean pip cache
          pip cache purge || true
          
          # Clean apt cache
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          
          echo "Disk space after cleanup:"
          df -h
        displayName: 'Free disk space'

      - bash: |
          echo "Memory before cleanup:"
          free -h

          # Stop Docker daemon to reclaim memory used by the daemon itself
          # (docker system prune above removes artifacts but the daemon stays resident)
          sudo systemctl stop docker || true
          sudo systemctl stop docker.socket || true
          sudo systemctl stop containerd || true

          # Stop background services not needed for unit tests
          sudo systemctl stop snapd || true
          sudo systemctl stop unattended-upgrades || true
          sudo systemctl stop packagekit || true

          # Drop Linux filesystem caches (page cache, dentries, inodes)
          sudo sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true

          echo "Memory after cleanup:"
          free -h
        displayName: 'Free memory'

      - task: UsePythonVersion@0
        displayName: 'Use Python $(PYTHON_VERSION)'
        inputs:
          versionSpec: $(PYTHON_VERSION)
          allowUnstable: true
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $python = (Get-Command python).Source
          $env:PYO3_PYTHON = $python
          Write-Host "##vso[task.setvariable variable=PYO3_PYTHON]$python"
          $libdir = python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR') or '')"
          $env:LD_LIBRARY_PATH = "$libdir`:$env:LD_LIBRARY_PATH"
          Write-Host "##vso[task.setvariable variable=LD_LIBRARY_PATH]$env:LD_LIBRARY_PATH"

          if (Get-Command rustup -ErrorAction SilentlyContinue) {
            rustup update stable
            rustup default stable
          } else {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            $env:PATH = "$HOME/.cargo/bin`:$env:PATH"
            Write-Host "##vso[task.prependpath]$HOME/.cargo/bin"
          }
          rustup component add rustfmt clippy

          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
        displayName: 'Configure Rust toolchain'
        condition: and(succeeded(), eq(variables['R2P2_WORKER'], 'true'))
      - task: CargoAuthenticate@0
        displayName: 'Authenticate Cargo to CFS'
        inputs:
          configFile: '$(Build.SourcesDirectory)/${{ parameters.CARGO_CONFIG_FILE }}'
        condition: and(succeeded(), eq(variables['R2P2_WORKER'], 'true'))
      - bash: |
          chmod +x '$(Build.SourcesDirectory)/eng/scripts/prepare-cargo-auth.sh'
          '$(Build.SourcesDirectory)/eng/scripts/prepare-cargo-auth.sh' '$(Build.SourcesDirectory)/${{ parameters.CARGO_CONFIG_FILE }}'
        displayName: 'Validate Cargo authentication'
        condition: and(succeeded(), eq(variables['R2P2_WORKER'], 'true'))
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo --config '$(Build.SourcesDirectory)/${{ parameters.CARGO_CONFIG_FILE }}' fmt --all -- --check
        displayName: 'Check R2P2 Rust formatting'
        condition: and(succeeded(), eq(variables['R2P2_WORKER'], 'true'))
        workingDirectory: $(Build.SourcesDirectory)/workers/r2p2
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo --config '$(Build.SourcesDirectory)/${{ parameters.CARGO_CONFIG_FILE }}' clippy --all-targets --locked -- -D warnings
        displayName: 'Lint R2P2 Rust code'
        condition: and(succeeded(), eq(variables['R2P2_WORKER'], 'true'))
        workingDirectory: $(Build.SourcesDirectory)/workers/r2p2
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location workers/r2p2
          try {
            cargo --config '$(Build.SourcesDirectory)/${{ parameters.CARGO_CONFIG_FILE }}' test --locked
          } finally {
            Pop-Location
          }
        displayName: 'Run R2P2 Rust unit tests'
        condition: and(succeeded(), eq(variables['R2P2_WORKER'], 'true'))
      - task: UseDotNet@2
        displayName: 'Install .NET 10'
        inputs:
          version: 10.0.x
      - task: NuGetAuthenticate@1
        displayName: 'Authenticate NuGet to CFS'
      - bash: |
          chmod +x eng/scripts/install-dependencies.sh
          eng/scripts/install-dependencies.sh $(PYTHON_VERSION) ${{ parameters.PROJECT_DIRECTORY }}
        displayName: 'Install Python dependencies (uv)'
        condition: and(eq(variables.isSdkRelease, false), eq(variables.isExtensionsRelease, false), eq(variables['USETESTPYTHONSDK'], false), eq(variables['USETESTPYTHONEXTENSIONS'], false))
      - bash: |
          chmod +x eng/scripts/test-setup.sh
          eng/scripts/test-setup.sh
        displayName: 'Build webhost and extensions (dotnet)'
        condition: and(eq(variables.isSdkRelease, false), eq(variables.isExtensionsRelease, false), eq(variables['USETESTPYTHONSDK'], false), eq(variables['USETESTPYTHONEXTENSIONS'], false))
      - bash: |
          PY_VER="$(PYTHON_VERSION)"
          echo "Python version: $PY_VER"

          # Extract minor version
          PY_MINOR="${PY_VER#*.}"
          PY_MINOR="${PY_MINOR%%.*}"

          if [ "$PY_MINOR" -ge 13 ]; then
              echo "Running proxy_worker tests (Python >= 3.13)..."
              python -m pytest -q -n auto --dist loadfile --reruns 4 --reruns-delay 5 --instafail \
                    --cov=./proxy_worker --cov-report xml --cov-branch tests/unittest_proxy
          else
              echo "Running unittests (Python < 3.13)..."
              python -m pytest -q -n auto --dist loadfile --reruns 4 --reruns-delay 5 --instafail \
                    --cov=./azure_functions_worker --cov-report xml --cov-branch tests/unittests
          fi
        displayName: "Running $(PYTHON_VERSION) Unit Tests"
        # Skip running tests for SDK and Extensions release branches. Public pipeline doesn't have permissions to download artifact.
        condition: and(eq(variables.isSdkRelease, false), eq(variables.isExtensionsRelease, false), eq(variables['USETESTPYTHONSDK'], false), eq(variables['USETESTPYTHONEXTENSIONS'], false), ne(variables['R2P2_WORKER'], 'true'))
        env:
          PYTHON_VERSION: $(PYTHON_VERSION)
          AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
        workingDirectory: $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}

      - bash: |
          flake8 bridge
        displayName: 'Lint R2P2 Python bridge'
        condition: and(succeeded(), eq(variables.isSdkRelease, false), eq(variables.isExtensionsRelease, false), eq(variables['USETESTPYTHONSDK'], false), eq(variables['USETESTPYTHONEXTENSIONS'], false), eq(variables['R2P2_WORKER'], 'true'))
        workingDirectory: $(Build.SourcesDirectory)/workers/r2p2

      - bash: |
          python -m pytest -q --reruns 4 --reruns-delay 5 --instafail unittest_r2p2
        displayName: 'Running $(PYTHON_VERSION) R2P2 bridge unit tests'
        condition: and(succeeded(), eq(variables.isSdkRelease, false), eq(variables.isExtensionsRelease, false), eq(variables['USETESTPYTHONSDK'], false), eq(variables['USETESTPYTHONEXTENSIONS'], false), eq(variables['R2P2_WORKER'], 'true'))
        workingDirectory: $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}/tests

      - bash: |
          echo "Cleaning up after tests..."
          # Remove build artifacts and caches
          rm -rf $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}/build || true
          rm -rf $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}/.pytest_cache || true

          # Clean Docker resources
          docker system prune -f || true

          # Clean pip cache
          pip cache purge || true

          echo "Disk space after cleanup:"
          df -h
        displayName: 'Cleanup after tests'
        condition: always()
  