trigger:
  branches:
    exclude:
      - '*'  # Don't trigger this pipeline automatically

# CI only, does not trigger on PRs.
pr: none

# Does not run on a schedule

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows
    sdl:
      codeSignValidation:
        enabled: true
        break: true

    stages:
      - stage: AggregatePackages
        jobs:
          - template: /eng/templates/official/jobs/aggregate-artifacts.yml@self
