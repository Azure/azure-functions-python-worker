parameters:
  pythonVersion: ''
  artifactName: ''

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: ${{ parameters.pythonVersion }}
    architecture: ${{ parameters.architecture }}
    addToPath: true
  condition: ne('${{ parameters.downloadArm64 }}', 'true')
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      $versionMap = @{
        "3.11" = "3.11.10"
        "3.12" = "3.12.3"
        "3.13" = "3.13.0"
      }

      $shortVersion = "${{ parameters.pythonVersion }}"
      if ($versionMap.ContainsKey($shortVersion)) {
        $fullVersion = $versionMap[$shortVersion]
        Write-Host "Mapped $shortVersion to full version $fullVersion"
        Write-Host "##vso[task.setvariable variable=fullPythonVersion]$fullVersion"
      }
      else {
        Write-Host "ERROR: Unsupported Python version '$shortVersion'"
        exit 1
      }
  displayName: 'Map pythonVersion to full version'
  condition: eq('${{ parameters.downloadArm64 }}', 'true')
- powershell: |
    $fullVersion = "$(fullPythonVersion)"
    $url = "https://www.python.org/ftp/python/$fullVersion/python-$fullVersion-arm64.exe"
    Write-Host "Downloading Python ARM64 from $url"
    Invoke-WebRequest -Uri $url -OutFile python-arm64.exe

    Start-Process -Wait -FilePath .\python-arm64.exe -ArgumentList '/quiet InstallAllUsers=1 PrependPath=0 Include_test=0'

    # Explicitly reference ARM64 Python
    $majorMinor = $fullVersion.Substring(0, $fullVersion.LastIndexOf('.')).Replace('.', '')
    $pythonPath = "C:\Program Files\Python$majorMinor\python.exe"
    & "$pythonPath" --version
    & "$pythonPath" -c "import platform; print(platform.machine())"
  displayName: 'Download and install Python ARM64'
  condition: eq('${{ parameters.downloadArm64 }}', 'true')
- powershell: |
    # Parse the Python minor version
    $PY_VER = "$(pythonVersion)"
    Write-Host "Python version: $PY_VER"
    # Extract minor version as integers
    $versionParts = $PY_VER.Split('.')
    $PY_MINOR = [int]$versionParts[1]
    Write-Host "Minor version: $PY_MINOR"

    # Set build-related variables based on Python minor version
    if( $PY_MINOR -ge 13 )
    {
      Write-Host "##vso[task.setvariable variable=workerPath;]$(proxyV4Path)"
      Write-Host "##vso[task.setvariable variable=proxyWorker;]true"
    }
    else
    {
      Write-Host "##vso[task.setvariable variable=workerPath;]$(prodV4Path)"
      Write-Host "##vso[task.setvariable variable=proxyWorker;]false"
    }
  displayName: 'Set necessary variables'
  env:
    pythonVersion: ${{ parameters.pythonVersion }}
- powershell: |
    Write-Host "workerPath: $(workerPath)"
    Write-Host "proxyWorker: $(proxyWorker)"
  displayName: 'Display variables'
- task: PowerShell@2
  inputs:
    filePath: 'eng\pack\scripts\win_deps.ps1'
    arguments: '${{ parameters.pythonVersion }}'
- bash: |
    pip install pip-audit
    pip-audit -r requirements.txt
  displayName: 'Run vulnerability scan'
  condition: ne(variables['pythonVersion'], '3.7')
- task: CopyFiles@2
  inputs:
    contents: '$(workerPath)'
    targetFolder: '$(Build.ArtifactStagingDirectory)'
    flattenFolders: true
- task: CopyFiles@2
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)\deps'
    contents: |
      **
      !grpc_tools\**\*
      !grpcio_tools*\*
      !build\**
      !docs\**
      !eng\**
      !python\**
      !tests\**
      !setuptools*\**
      !_distutils_hack\**
      !distutils-precedence.pth
      !pkg_resources\**
      !*.dist-info\**
      !werkzeug\debug\shared\debugger.js
      !proxy_worker\**
    targetFolder: '$(Build.ArtifactStagingDirectory)'
  condition: eq(variables['proxyWorker'], false)
  displayName: 'Copy azure_functions_worker files'
- task: CopyFiles@2
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)\deps'
    contents: |
      **
      !grpc_tools\**\*
      !grpcio_tools*\*
      !build\**
      !docs\**
      !eng\**
      !python\**
      !tests\**
      !setuptools*\**
      !_distutils_hack\**
      !distutils-precedence.pth
      !pkg_resources\**
      !*.dist-info\**
      !werkzeug\debug\shared\debugger.js
      !dateutil\**
      !azure_functions_worker\**
    targetFolder: '$(Build.ArtifactStagingDirectory)'
  condition: eq(variables['proxyWorker'], true)
  displayName: 'Copy proxy_worker files'
