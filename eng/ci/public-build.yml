trigger:
  batch: true
  branches:
    include:
    - dev-3*
    - sdk/*
    - extensions/*

pr:
  branches:
    include:
    - dev-3*

schedules:
- cron: '0 0 * * MON'
  displayName: At 12:00 AM, only on Monday
  branches:
    include:
      - dev-3*
  always: true

resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc-public
      image: 1es-windows-2022
      os: windows

    sdl:
      codeql:
        compiled:
          enabled: true # still only runs for default branch
        sourceLanguages: python, powershell
        excludePathPatterns: deps/,build/
        runSourceLanguagesInSourceAnalysis: true

    settings:
      skipBuildTagsForGitHubPullRequests: ${{ variables['System.PullRequest.IsFork'] }}

    stages:
    - stage: Build
      jobs:
      - template: /eng/templates/jobs/build.yml@self
      # Skip the build stage for SDK and Extensions release branches. This stage will fail because pyproject.toml contains the updated (and unreleased) library version
      condition: and(eq(variables.isSdkRelease, false), eq(variables.isExtensionsRelease, false), eq(variables['USETESTPYTHONSDK'], false), eq(variables['USETESTPYTHONEXTENSIONS'], false))
    - stage: RunUnitTests
      dependsOn: Build
      jobs:
        - template: /eng/templates/jobs/ci-unit-tests.yml@self