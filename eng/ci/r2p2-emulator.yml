# R2P2 is the Python 3.15 worker. This emulator suite builds a Docker image that
# stages the Rust worker into the real Host, starts the Cosmos DB + Event Hubs
# (+ Azurite) emulators on the agent, and runs workers/tests/emulator_tests
# against the staged R2P2 over the host network. It runs on every dev commit and
# PR (no path filter) so Python 3.15 emulator coverage gates PRs alongside the
# classic 3.10-3.14 emulator matrix, which cannot host 3.15 (grpcio/aiohttp have
# no cp315 wheels and proxy_worker is not the 3.15 worker).
#
# Durable Functions + Service Bus emulator suites are excluded on 3.15:
# azure-functions-durable (aiohttp) and the Service Bus SDK binding (uamqp) have
# no cp315 wheels yet. Revisit once those publish cp315 wheels.
trigger:
  batch: true
  branches:
    include:
    - dev

pr:
  branches:
    include:
    - dev

resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

variables:
  - template: /eng/templates/utils/variables.yml@self
  - template: /eng/templates/utils/emulator-variables.yml@self

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc-public
      image: 1es-ubuntu-22.04
      os: linux

    settings:
      skipBuildTagsForGitHubPullRequests: ${{ variables['System.PullRequest.IsFork'] }}

    stages:
    - stage: EmulatorR2P2
      jobs:
      - template: /eng/templates/jobs/r2p2-emulator.yml@self
        parameters:
          PYTHON_VERSION: '3.15'
          SIMPLE_VERSION: '315'
          PROJECT_NAME: 'R2P2 (Python 3.15)'
