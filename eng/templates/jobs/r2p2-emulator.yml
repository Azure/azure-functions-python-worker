parameters:
  PYTHON_VERSION: ''
  SIMPLE_VERSION: ''
  PROJECT_NAME: ''

jobs:
  - job: "RustEmulator${{ parameters.SIMPLE_VERSION }}"
    displayName: 'Emulator ${{ parameters.PROJECT_NAME }}'

    pool:
      name: 1es-pool-azfunc-public
      image: 1es-ubuntu-22.04
      os: linux

    steps:
      - template: /eng/templates/shared/r2p2-emulator-steps.yml@self
        parameters:
          PYTHON_VERSION: ${{ parameters.PYTHON_VERSION }}
          PROJECT_NAME: ${{ parameters.PROJECT_NAME }}
