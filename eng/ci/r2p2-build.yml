# R2P2 is the Python 3.15 worker. These build/unit checks run on every dev
# commit and PR (no path filter) so Python 3.15 coverage gates PRs alongside
# the classic 3.10-3.14 pytest suites, which cannot host 3.15 (grpcio/aiohttp
# have no cp315 wheels and proxy_worker is not the 3.15 worker).
trigger:
  batch: true
  branches:
    include:
    - dev

pr:
  branches:
    include:
    - dev

resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

variables:
  - template: /eng/templates/utils/variables.yml@self

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc-public
      image: 1es-windows-2022
      os: windows

    sdl:
      codeql:
        compiled:
          enabled: true # still only runs for default branch
        sourceLanguages: python, powershell
        excludePathPatterns: deps/,build/,workers/r2p2/target/
        runSourceLanguagesInSourceAnalysis: true

    settings:
      skipBuildTagsForGitHubPullRequests: ${{ variables['System.PullRequest.IsFork'] }}

    stages:
    # R2P2 Build & Test (cargo fmt/clippy/build/test + Python bridge flake8).
    # The Rust binary embeds CPython via PyO3, so it is built once per target
    # interpreter (3.15 today) on each supported OS/architecture. ARM64 Linux
    # and Windows artifacts are cross-compiled after all host checks run on the
    # same x64 images used by the native x64 jobs.
    - stage: BuildR2P2
      jobs:
      - template: /eng/templates/jobs/r2p2-build.yml@self
        parameters:
          PYTHON_VERSION: '3.15.0-rc.1'
          SIMPLE_VERSION: '315'
          PROJECT_NAME: 'R2P2 (Python 3.15)'
          PROJECT_DIRECTORY: 'workers/r2p2'
          OS_ARCH: 'LINUX_X64'
          POOL_NAME: '1es-pool-azfunc-public'
          POOL_IMAGE: '1es-ubuntu-22.04'
          POOL_OS: 'linux'
      - template: /eng/templates/jobs/r2p2-build.yml@self
        parameters:
          PYTHON_VERSION: '3.15.0-rc.1'
          SIMPLE_VERSION: '315'
          PROJECT_NAME: 'R2P2 (Python 3.15)'
          PROJECT_DIRECTORY: 'workers/r2p2'
          OS_ARCH: 'WINDOWS_X64'
          POOL_NAME: '1es-pool-azfunc-public'
          POOL_IMAGE: '1es-windows-2022'
          POOL_OS: 'windows'
      - template: /eng/templates/jobs/r2p2-build.yml@self
        parameters:
          PYTHON_VERSION: '3.15.0-rc.1'
          SIMPLE_VERSION: '315'
          PROJECT_NAME: 'R2P2 (Python 3.15)'
          PROJECT_DIRECTORY: 'workers/r2p2'
          OS_ARCH: 'LINUX_ARM64'
          POOL_NAME: '1es-pool-azfunc-public'
          POOL_IMAGE: '1es-ubuntu-22.04'
          POOL_OS: 'linux'
          HOST_ARCHITECTURE: 'x64'
          TARGET_ARCHITECTURE: 'arm64'
          TARGET_TRIPLE: 'aarch64-unknown-linux-gnu'
      - template: /eng/templates/jobs/r2p2-build.yml@self
        parameters:
          PYTHON_VERSION: '3.15.0-rc.1'
          SIMPLE_VERSION: '315'
          PROJECT_NAME: 'R2P2 (Python 3.15)'
          PROJECT_DIRECTORY: 'workers/r2p2'
          OS_ARCH: 'WINDOWS_ARM64'
          POOL_NAME: '1es-pool-azfunc-public'
          POOL_IMAGE: '1es-windows-2022'
          POOL_OS: 'windows'
          HOST_ARCHITECTURE: 'x64'
          TARGET_ARCHITECTURE: 'arm64'
          TARGET_TRIPLE: 'aarch64-pc-windows-msvc'
      - template: /eng/templates/jobs/r2p2-build.yml@self
        parameters:
          PYTHON_VERSION: '3.15.0-rc.1'
          SIMPLE_VERSION: '315'
          PROJECT_NAME: 'R2P2 (Python 3.15)'
          PROJECT_DIRECTORY: 'workers/r2p2'
          OS_ARCH: 'OSX_ARM64'
          POOL_NAME: 'Azure Pipelines'
          POOL_IMAGE: 'macOS-latest'
          POOL_OS: 'macOS'
      # macOS x64 can be added with OS_ARCH 'OSX_X64' and POOL_IMAGE 'macOS-13'.
