jobs:

- job: "CreateReleaseBranch"
  displayName: 'Create Release Branch'
  pool:
    name: 1es-pool-azfunc
    image: 1es-ubuntu-22.04
    os: linux
  steps:
  - powershell: |
      $githubToken = "$(GithubPat)"
      $newLibraryVersion = "$(NewLibraryVersion)"
      
      if($newLibraryVersion -match '(\d)+.(\d)+.(\d)+') {
          # Create GitHub credential
          git config --global user.name "AzureFunctionsPython"
          git config --global user.email "azfunc@microsoft.com"
      
          # Heading to Artifact Repository
          Write-Host "Operating based on $stagingDirectory/azure-functions-python-worker"
          git checkout 1.x-v1  # TODO: make this configurable
          git checkout -b "v1-runtime-release/$newLibraryVersion"
      
          # Change __init__.py version
          Write-Host "Change version number in azure_functions_worker_v1/version.py to $newLibraryVersion"
          ((Get-Content azure_functions_worker_v1/version.py) -replace "VERSION = '(\d)+.(\d)+.*'", "VERSION = '$newLibraryVersion'" -join "`n") + "`n" | Set-Content -NoNewline azure_functions_worker_v1/version.py
          git add azure_functions_worker_v1/version.py
          git commit -m "build: update Python V1 Runtime Version to $newLibraryVersion"
      
          # Create release branch v1-runtime-release/X.Y.Z
          Write-Host "Creating release branch v1-runtime-release/$newLibraryVersion"
          git push --repo="https://$githubToken@github.com/Azure/azure-functions-python-worker.git"
      } else {
          Write-Host "NewLibraryVersion $newLibraryVersion is malformed (example: 1.5.0)"
          exit -1
      }
    displayName: 'Push v1-runtime-release/x.y.z'

- job: "CheckReleaseBranch"
  dependsOn: ['CreateReleaseBranch']
  displayName: '(Manual) Check Release Branch'
  pool: server
  steps:
  - task: ManualValidation@1
    displayName: '(Optional) Modify v1-runtime-release/x.y.z branch'
    inputs:
      notifyUsers: ''  # No email notifications sent
      instructions: |
        1. Check if the https://github.com/Azure/azure-functions-python-worker/tree/v1-runtime-release/$(NewLibraryVersion) build succeeds and passes all unit tests.
        2. If not, modify the v1-runtime-release/$(NewLibraryVersion) branch.
        3. Ensure v1-runtime-release/$(NewLibraryVersion) branch contains all necessary changes.

- job: "CreateReleaseTag"
  dependsOn: ['CheckReleaseBranch']
  displayName: 'Create Release Tag'
  steps:
  - powershell: |
      $githubToken = "$(GithubPat)"
      $newLibraryVersion = "$(NewLibraryVersion)"
      
      if($newLibraryVersion -match '(\d)+.(\d)+.(\d)+') {
          # Create GitHub credential
          git config --global user.name "AzureFunctionsPython"
          git config --global user.email "azfunc@microsoft.com"
      
          # Clone Repository
          git clone https://$githubToken@github.com/Azure/azure-functions-python-worker
          Write-Host "Cloned azure-functions-python-worker into local"
          Set-Location "azure-functions-python-worker"
          git checkout "origin/v1-runtime-release/$newLibraryVersion"
      
          # Create v1-runtime-release tag X.Y.Z
          Write-Host "Creating v1-runtime-release tag $newLibraryVersion"
          git tag -a "$newLibraryVersion" -m "$newLibraryVersion"
      
          # Push tag to remote
          git push origin $newLibraryVersion
      } else {
          Write-Host "NewLibraryVersion $newLibraryVersion is malformed (example: 1.5.0)"
          exit -1
      }
    displayName: 'Tag and push x.y.z'
  - powershell: |
      $githubUser = "$(GithubUser)"
      $githubToken = "$(GithubPat)"
      $newLibraryVersion = "$(NewLibraryVersion)"
      
      if($newLibraryVersion -match '(\d)+.(\d)+.(\d)+') {
          # Create GitHub credential
          $credential = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${githubUser}:${githubToken}"))
      
          # Create Release Note
          Write-Host "Creating release note in GitHub"
          $body = (@{tag_name="$newLibraryVersion";name="Release $newLibraryVersion";body="- Fill in Release Note Here";draft=$true} | ConvertTo-Json -Compress)
          $response = Invoke-WebRequest -Headers @{"Cache-Control"="no-cache";"Content-Type"="application/json";"Authorization"="Basic $credential"} -Method Post -Body "$body" -Uri "https://api.github.com/repos/Azure/azure-functions-python-worker/releases"
      
          # Return Value
          if ($response.StatusCode -ne 201) {
              Write-Host "Failed to create release note in GitHub"
              exit -1
          }
      
          $draftUrl = $response | ConvertFrom-Json | Select -expand url
          Write-Host "Release draft created in $draftUrl"
      } else {
          Write-Host "NewLibraryVersion $newLibraryVersion is malformed (example: 1.1.8)"
          exit -1
      }
    displayName: 'Create GitHub release draft'

- job: "CheckGitHubRelease"
  dependsOn: ['CreateReleaseTag']
  displayName: '(Manual) Check GitHub release note'
  pool: server
  steps:
  - task: ManualValidation@1
    displayName: 'Write GitHub release note'
    inputs:
      notifyUsers: ''
      instructions: 'Please head to https://github.com/Azure/azure-functions-python-worker/releases to finish the release note'

- job: "TestWithWorker"
  dependsOn: ['CheckGitHubRelease']
  displayName: 'Test with Worker'
  steps:
  - powershell: |
      $githubUser = "$(GithubUser)"
      $githubToken = "$(GithubPat)"
      $newLibraryVersion = "$(NewLibraryVersion)"
      $newBranch = "sdk/$newLibraryVersion"
      
      if($newLibraryVersion -match '(\d)+.(\d)+.(\d)+') {
          # Create GitHub credential
          git config --global user.name "AzureFunctionsPython"
          git config --global user.email "azfunc@microsoft.com"
      
          # Create GitHub credential
          $credential = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${githubUser}:${githubToken}"))
      
          # Clone Repository
          git clone https://$githubToken@github.com/Azure/azure-functions-python-worker
          Write-Host "Cloned azure-functions-python-worker into local and checkout $newBranch branch"
          Set-Location "azure-functions-python-worker"
          git checkout -b $newBranch "origin/dev"
      
          # Modify Runtime Version in pyproject.toml
          Write-Host "Replacing Runtime version in worker's pyproject.toml"
          ((Get-Content pyproject.toml) -replace '"azure-functions-runtime-v1==(\d)+.(\d)+.*"','"azure-functions-runtime-v1==$(NewLibraryVersion)"' -join "`n") + "`n" | Set-Content -NoNewline pyproject.toml
      
          # Commit Python Version
          Write-Host "Pushing $newBranch to azure-functions-python-worker repo"
          git add pyproject.toml
          git commit -m "Update Python V1 Runtime Version to $newLibraryVersion"
          git push origin $newBranch
      
          # Create PR
          Write-Host "Creating PR draft in GitHub"
          $body = (@{head="$newBranch";base="dev";body="Python V1 Runtime Version [$newLibraryVersion](https://github.com/Azure/azure-functions-python-worker/releases/tag/$newLibraryVersion)";draft=$true;maintainer_can_modify=$true;title="build: update Python V1 Runtime Version to $newLibraryVersion"} | ConvertTo-Json -Compress)
          $response = Invoke-WebRequest -Headers @{"Cache-Control"="no-cache";"Content-Type"="application/json";"Authorization"="Basic $credential";"Accept"="application/vnd.github.v3+json"} -Method Post -Body "$body" -Uri "https://api.github.com/repos/Azure/azure-functions-python-worker/pulls"
      
          # Return Value
          if ($response.StatusCode -ne 201) {
              Write-Host "Failed to create PR in Azure Functions Python Worker"
              exit -1
          }
      
          $draftUrl = $response | ConvertFrom-Json | Select -expand url
          Write-Host "PR draft created in $draftUrl"
      } else {
          Write-Host "NewLibraryVersion $newLibraryVersion is malformed (example: 1.1.8)"
          exit -1
      }
    displayName: 'Create PR in Worker Repo'

- job: "WaitForPythonWorkerPR"
  dependsOn: ['TestWithWorker']
  displayName: '(Manual) Check Python Worker PR'
  pool: server
  steps:
  - task: ManualValidation@1
    displayName: 'Check Python Worker PR'
    inputs:
      notifyUsers: ''
      instructions: |
        1. Please wait and check if all goes green in the https://github.com/Azure/azure-functions-python-worker/pulls
        2. Merge the PR into worker dev branch

- job: "PyPIPackage"
  dependsOn: ['WaitForPythonWorkerPR']
  displayName: 'PyPI Package'
  steps:
  - task: DownloadPipelineArtifact@2
    displayName: 'Download Python V1 Runtime v1-runtime-release/x.y.z Artifact'
    inputs:
      buildType: specific
      project: '3f99e810-c336-441f-8892-84983093ad7f'
      definition: 652
      specificBuildWithTriggering: true
      buildVersionToDownload: latestFromBranch
      branchName: refs/heads/v1-runtime-release
      targetPath: PythonRuntimeArtifact
  - task: UsePythonVersion@0
    displayName: 'Use Python 3.13'
    inputs:
      versionSpec: 3.13
  - powershell: |
      $newLibraryVersion = "$(NewLibraryVersion)"
      $pypiToken = "$(PypiToken)"
      
      # Setup local Python environment
      Write-Host "Setup local Python environment"
      python -m pip install -U pip
      pip install twine
  
      # Publish artifacts to PyPi
      twine upload --repository-url https://upload.pypi.org/legacy/ --username "__token__" --password "$pypiToken" PythonRuntimeArtifact/azure-functions-runtime-v1/dist/*
      Start-Sleep -Seconds 3
  
      # Checking if the new version is uploaded
      Write-Host "Check if new version is uploaded"
      $response = Invoke-WebRequest -Headers @{"Cache-Control"="no-cache"} -Method Get -Uri "https://pypi.org/project/azure-functions-runtime-v1/$newLibraryVersion/"
  
      # Return Value
      if ($response.StatusCode -ne 200) {
          Write-Host "Failed to verify https://pypi.org/project/azure-functions-runtime-v1/$newLibraryVersion/"
          exit -1
      }
    displayName: 'Publish package to pypi.org'
