# R2P2 is the Python 3.15 worker. This end-to-end suite (Docker image staging
# the Rust worker into the real Host, running workers/tests/endtoend) runs on
# every dev commit and PR (no path filter) so Python 3.15 E2E coverage gates
# PRs alongside the classic 3.10-3.14 E2E matrix, which cannot host 3.15
# (grpcio/aiohttp have no cp315 wheels and proxy_worker is not the 3.15 worker).
trigger:
  batch: true
  branches:
    include:
    - dev

pr:
  branches:
    include:
    - dev

resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

variables:
  - template: /eng/templates/utils/variables.yml@self

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc-public
      image: 1es-ubuntu-22.04
      os: linux

    settings:
      skipBuildTagsForGitHubPullRequests: ${{ variables['System.PullRequest.IsFork'] }}

    stages:
    # R2P2 end-to-end tests: build the Docker image that stages the Rust
    # worker into the real Host image, then run the shared pytest E2E harness
    # (WebHostTestCase) against it using the full endtoend function-app suite
    # (the same apps that validate the classic Python worker).
    - stage: E2ER2P2
      jobs:
      - template: /eng/templates/jobs/r2p2-e2e.yml@self
        parameters:
          PYTHON_VERSION: '3.15'
          SIMPLE_VERSION: '315'
          PROJECT_NAME: 'R2P2 (Python 3.15)'
