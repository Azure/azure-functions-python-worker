#
# Packaging template for R2P2 (Python 3.15+).
#
# Earlier Python workers use separate OS-specific templates. This template
# handles every R2P2 Windows, Linux, and macOS build, selecting the platform
# build script and staging a consistent V4 NuGet artifact layout.
#
# Parameters:
#   pythonVersion : interpreter to link against (e.g. 3.15)
#   artifactName  : pipeline artifact name (e.g. 3.15_WINDOWS_ARM64)
#   osName        : WINDOWS | LINUX | OSX (selects the build script)
#   architecture  : x64 | x86 | arm64; packaged R2P2 target architecture
#   hostArchitecture: x64 | x86; build-time Python; defaults to architecture
#   cpythonSourceSha256: reviewed source digest; required for Linux ARM64

parameters:
  pythonVersion: ''
  artifactName: ''
  osName: ''
  architecture: 'x64'
  hostArchitecture: ''
  cpythonSourceSha256: ''
  cpythonWindowsSdkSha256: ''

steps:
- ${{ if and(eq(parameters.osName, 'WINDOWS'), eq(parameters.architecture, 'arm64')) }}:
  - task: UniversalPackages@0
    displayName: 'Download pinned CPython Windows ARM64 SDK from internal feed'
    inputs:
      command: 'download'
      feedsToUse: 'internal'
      vstsFeed: 'internal/PythonWorker_Internal_PublicPackages'
      vstsFeedPackage: 'cpython-windows-arm64-sdk'
      vstsPackageVersion: '${{ parameters.pythonVersion }}'
      downloadDirectory: '$(Agent.TempDirectory)/cpython-windows-arm64-sdk/${{ parameters.pythonVersion }}'
- ${{ if and(eq(parameters.osName, 'LINUX'), eq(parameters.architecture, 'arm64')) }}:
  - task: UniversalPackages@0
    displayName: 'Download pinned CPython source from internal feed'
    inputs:
      command: 'download'
      feedsToUse: 'internal'
      vstsFeed: 'internal/PythonWorker_Internal_PublicPackages'
      vstsFeedPackage: 'cpython-source'
      vstsPackageVersion: '${{ parameters.pythonVersion }}'
      downloadDirectory: '$(Agent.TempDirectory)/cpython-source/${{ parameters.pythonVersion }}'
- task: PipAuthenticate@1
  displayName: 'Authenticate pip to CFS'
  inputs:
    artifactFeeds: 'public/upstream-public'
    onlyAddExtraIndex: false
- task: UsePythonVersion@0
  inputs:
    versionSpec: ${{ parameters.pythonVersion }}
    architecture: ${{ coalesce(parameters.hostArchitecture, parameters.architecture) }}
    allowUnstable: true
    addToPath: true
    ${{ if and(eq(parameters.osName, 'LINUX'), eq(parameters.architecture, 'arm64')) }}:
      # Acquire the pinned x64 build interpreter on a cache miss, as for Linux x64.
      # The internally staged archive supplies target source, not a host interpreter.
      disableDownloadFromRegistry: false
- task: CargoAuthenticate@0
  displayName: 'Authenticate Cargo to CFS'
  inputs:
    configFile: '$(Build.SourcesDirectory)/workers/r2p2/.cargo/config.toml'
- ${{ if eq(parameters.osName, 'WINDOWS') }}:
  - task: PowerShell@2
    displayName: 'Build R2P2 + dependencies'
    inputs:
      filePath: 'eng/pack/scripts/r2p2_deps.ps1'
      arguments: '-PythonVersion ${{ parameters.pythonVersion }} -Architecture ${{ parameters.architecture }}'
      pwsh: true
    ${{ if eq(parameters.architecture, 'arm64') }}:
      env:
        CPYTHON_ARM64_ARCHIVE: '$(Agent.TempDirectory)/cpython-windows-arm64-sdk/${{ parameters.pythonVersion }}/pythonarm64.${{ parameters.pythonVersion }}.nupkg'
        CPYTHON_ARM64_SHA256: '${{ parameters.cpythonWindowsSdkSha256 }}'
- ${{ else }}:
  - task: ShellScript@2
    displayName: 'Build R2P2 + dependencies'
    inputs:
      disableAutoCwd: true
      scriptPath: 'eng/pack/scripts/r2p2_deps.sh'
      args: '${{ parameters.pythonVersion }} ${{ parameters.architecture }}'
    ${{ if and(eq(parameters.osName, 'LINUX'), eq(parameters.architecture, 'arm64')) }}:
      env:
        CPYTHON_ARM64_ARCHIVE: '$(Agent.TempDirectory)/cpython-source/${{ parameters.pythonVersion }}/Python-${{ parameters.pythonVersion }}.tgz'
        CPYTHON_ARM64_SHA256: '${{ parameters.cpythonSourceSha256 }}'
- task: CopyFiles@2
  displayName: 'Copy R2P2 files'
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)/deps'
    contents: |
      **
      !grpc/**
      !grpc_tools/**/*
      !grpcio*/**
      !build/**
      !docs/**
      !eng/**
      !python/**
      !tests/**
      !setuptools*/**
      !_distutils_hack/**
      !distutils-precedence.pth
      !pkg_resources/**
      !*.dist-info/**
      !werkzeug/debug/shared/debugger.js
      !azure_functions_worker/**
      !proxy_worker/**
      !uvloop/**
      !six.py
      !typing_extensions.py
    targetFolder: '$(Build.ArtifactStagingDirectory)'
- task: CopyFiles@2
  displayName: 'Copy R2P2 launcher shim'
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)/workers/python/r2p2'
    contents: 'worker.py'
    targetFolder: '$(Build.ArtifactStagingDirectory)'
- powershell: >-
    python -I -S "$(Build.SourcesDirectory)/eng/pack/scripts/validate_worker_payload.py"
    "$(Build.ArtifactStagingDirectory)"
    --python-version '${{ parameters.pythonVersion }}'
    --os ${{ parameters.osName }} --architecture ${{ parameters.architecture }}
  displayName: 'Validate R2P2 artifact contents and binary'
