      !*.dist-info/**
      !werkzeug/debug/shared/debugger.js
      !proxy_worker/**
      !uvloop/**
      !six.py
      !typing_extensions.py
    targetFolder: '$(Build.ArtifactStagingDirectory)'
  condition: eq(variables['rustWorker'], 'true')
  displayName: 'Copy Rust worker files'
- task: CopyFiles@2
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)/workers/python/rust_worker'
    contents: 'worker.config.json'
    targetFolder: '$(Build.ArtifactStagingDirectory)'
  condition: eq(variables['rustWorker'], 'true')
  displayName: 'Copy Rust worker.config.json'
- powershell: |
    $root = "$(Build.ArtifactStagingDirectory)"

    # The Rust worker owns the gRPC transport (tonic), so the Python grpc stack
    # and proxy_worker are intentionally absent. Both the v2 and v1 runtimes are
    # staged; the bridge selects one per programming model and drives its native
    # path. The Rust-specific worker.config.json is copied alongside the binary.
    $expected = @(
        "rust_worker",
        "worker.config.json",
        "bridge/bridge.py",
        "bridge/protos_adapter.py",
        "azure_functions_runtime",
        "azure_functions_runtime/native_invocation.py",
        "azure_functions_runtime/utils/executor.py",
        "azure_functions_runtime_v1",
        "azure_functions_runtime_v1/native_invocation.py",
        "azure_functions_runtime_v1/utils/executor.py",
        "azure",
        "azurefunctions",
        "google"
    )
    $forbidden = @("grpc", "proxy_worker", "uvloop")

    $missing = @()
    foreach ($item in $expected) {
        if (-not (Test-Path (Join-Path $root $item))) { $missing += $item }
    }
    $present = @()
    foreach ($item in $forbidden) {
        if (Test-Path (Join-Path $root $item)) { $present += $item }
    }

    if ($missing.Count -gt 0) {
        Write-Error "Validation failed. Missing expected files/folders:`n$($missing -join "`n")"
        exit 1
    }
    if ($present.Count -gt 0) {
        Write-Error "Validation failed. Pruned packages unexpectedly present:`n$($present -join "`n")"
        exit 1
    }
    Write-Host "✅ Validation passed. Rust worker artifact contents are correct."
  displayName: "Validate Rust worker artifact contents"
  condition: eq(variables['rustWorker'], 'true')
