trigger:
  batch: true
  branches:
    include:
    - dev
  paths:
    include:
    - workers/rust_worker/*
    - workers/python/rust_worker/*
    - runtimes/v2/*
    - eng/ci/rust-worker-build.yml
    - eng/templates/jobs/rust-build.yml
    - eng/templates/shared/rust-build-steps.yml

pr:
  branches:
    include:
    - dev
  paths:
    include:
    - workers/rust_worker/*
    - workers/python/rust_worker/*
    - runtimes/v2/*
    - eng/ci/rust-worker-build.yml
    - eng/templates/jobs/rust-build.yml
    - eng/templates/shared/rust-build-steps.yml

resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

variables:
  - template: /eng/templates/utils/variables.yml@self

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc-public
      image: 1es-windows-2022
      os: windows

    sdl:
      codeql:
        compiled:
          enabled: true # still only runs for default branch
        sourceLanguages: python, powershell
        excludePathPatterns: deps/,build/,workers/rust_worker/target/
        runSourceLanguagesInSourceAnalysis: true

    settings:
      skipBuildTagsForGitHubPullRequests: ${{ variables['System.PullRequest.IsFork'] }}

    stages:
    # Rust Worker Build & Test (cargo fmt/clippy/build/test + Python bridge selftest).
    # The Rust binary embeds CPython via PyO3, so it is built once against the
    # target interpreter (3.14 today; add versions as new CPython lines are supported).
    - stage: BuildRustWorker
      jobs:
      - template: /eng/templates/jobs/rust-build.yml@self
        parameters:
          PYTHON_VERSION: '3.14'
          SIMPLE_VERSION: '314'
          PROJECT_NAME: 'Rust Proxy Worker (Python 3.14)'
          PROJECT_DIRECTORY: 'workers/rust_worker'
