parameters:
  PROJECT_DIRECTORY: 'workers'
  CARGO_CONFIG_FILE: 'workers/r2p2/.cargo/config.toml'

jobs:
  - job: "TestPython"
    displayName: "Run Python Emulator Tests"
    # Secret variables are unavailable to pull requests from forks.
    condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))

    pool:
      name: ${{ parameters.PoolName }}
      image: 1es-ubuntu-24.04-min
      os: linux

    strategy:
      matrix:
        Python310:
          PYTHON_VERSION: '3.10'
        Python311:
          PYTHON_VERSION: '3.11'
        Python312:
          PYTHON_VERSION: '3.12'
        Python313:
          PYTHON_VERSION: '3.13'
        Python314:
          PYTHON_VERSION: '3.14'
    steps:
      - task: PipAuthenticate@1
        displayName: 'Authenticate pip to CFS'
        inputs:
          artifactFeeds: 'public/upstream-public'
          onlyAddExtraIndex: false
      - bash: |
          echo "Disk space before cleanup:"
          df -h
          
          # Clean up Docker resources
          docker system prune -af --volumes || true
          
          # Clean pip cache
          pip cache purge || true
          
          # Clean apt cache
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          
          echo "Disk space after cleanup:"
          df -h
        displayName: 'Free disk space'

      - bash: |
          echo "Memory before cleanup:"
          free -h

          # Stop background services not needed for emulator tests.
          # NOTE: Docker must remain running for CosmosDB/EventHub/ServiceBus emulators,
          # so do NOT stop docker, docker.socket, or containerd here.
          sudo systemctl stop snapd || true
          sudo systemctl stop unattended-upgrades || true
          sudo systemctl stop packagekit || true

          # Drop Linux filesystem caches (page cache, dentries, inodes).
          # This is safe for running processes, including Docker containers.
          sudo sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true

          echo "Memory after cleanup:"
          free -h
        displayName: 'Free memory'

      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(PYTHON_VERSION)
      - task: UseDotNet@2
        displayName: 'Install .NET 10'
        inputs:
          version: 10.0.x
      - task: NuGetAuthenticate@1
        displayName: 'Authenticate NuGet to CFS'
      - bash: |
          chmod +x eng/scripts/install-dependencies.sh
          eng/scripts/install-dependencies.sh $(PYTHON_VERSION) ${{ parameters.PROJECT_DIRECTORY }}
        displayName: 'Install Python dependencies (uv)'
        condition: and(eq(variables.isSdkRelease, false), eq(variables.isExtensionsRelease, false), eq(variables['USETESTPYTHONSDK'], false), eq(variables['USETESTPYTHONEXTENSIONS'], false))
      - bash: |
          chmod +x eng/scripts/test-setup.sh
          eng/scripts/test-setup.sh
        displayName: 'Build webhost and extensions (dotnet)'
        condition: and(eq(variables.isSdkRelease, false), eq(variables.isExtensionsRelease, false), eq(variables['USETESTPYTHONSDK'], false), eq(variables['USETESTPYTHONEXTENSIONS'], false))
      - task: DownloadPipelineArtifact@2
        displayName: 'Download Python SDK Artifact'
        inputs:
          buildType: specific
          artifactName: 'azure-functions'
          project: 'internal'
          definition: 679
          buildVersionToDownload: latest
          targetPath: '$(Pipeline.Workspace)/PythonSdkArtifact'
        condition: or(eq(variables.isSdkRelease, true), eq(variables['USETESTPYTHONSDK'], true))
      - bash: |
          chmod +x eng/scripts/test-sdk.sh
          chmod +x eng/scripts/test-setup.sh

          eng/scripts/test-sdk.sh $(Pipeline.Workspace) $(PYTHON_VERSION)
          eng/scripts/test-setup.sh
        displayName: 'Install test python sdk, dependencies and the worker'
        condition: or(eq(variables.isSdkRelease, true), eq(variables['USETESTPYTHONSDK'], true))
      - task: DownloadPipelineArtifact@2
        displayName: 'Download Python Extension Artifact'
        inputs:
          buildType: specific
          artifactName: $(PYTHONEXTENSIONNAME)
          project: 'internal'
          definition: 798
          buildVersionToDownload: latest
          targetPath: '$(Pipeline.Workspace)/PythonExtensionArtifact'
        condition: or(eq(variables.isExtensionsRelease, true), eq(variables['USETESTPYTHONEXTENSIONS'], true))
      - bash: |
          chmod +x eng/scripts/test-setup.sh
          chmod +x eng/scripts/test-extensions.sh

          eng/scripts/test-extensions.sh $(Pipeline.Workspace) $(PYTHON_VERSION) $(PYTHONEXTENSIONNAME)
          eng/scripts/test-setup.sh
        displayName: 'Install test python extension, dependencies and the worker'
        condition: or(eq(variables.isExtensionsRelease, true), eq(variables['USETESTPYTHONEXTENSIONS'], true))
      - bash: |
          # The minimal image (1es-ubuntu-24.04-min) does not ship the Docker
          # Compose v2 CLI plugin, so `docker compose` fails with an
          # "unknown shorthand flag: 'f'" error. Install it from the Ubuntu
          # archive (already reachable in the pipeline) via the
          # docker-compose-v2 package. Docker's own apt repo is not configured,
          # so docker-compose-plugin is not an option here.
          #
          # This must run BEFORE any emulator container is started: installing
          # docker-compose-v2 also upgrades moby-engine/moby-cli, which restarts
          # the Docker daemon and would kill already-running containers (e.g. the
          # CosmosDB emulator), causing connection-refused errors during tests.
          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose v2 plugin not found; installing..."
            sudo apt-get update
            sudo apt-get install -y docker-compose-v2
          fi
          docker compose version
        displayName: 'Ensure Docker Compose v2 is installed'
      - bash: |
          # Clean up Docker resources to free disk space
          docker system prune -af --volumes
          df -h
          
          docker pull mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
          docker run --detach --env ENABLE_EXPLORER=false --publish 8081:8081 mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
          docker ps
        displayName: "Start CosmosDB Emulator"
      - bash: |
          docker compose -f ${{ parameters.PROJECT_DIRECTORY }}/tests/emulator_tests/utils/eventhub/docker-compose.yml pull
          docker compose -f ${{ parameters.PROJECT_DIRECTORY }}/tests/emulator_tests/utils/eventhub/docker-compose.yml up -d
        displayName: 'Install Azurite and Start EventHub Emulator'
      - bash: |
            python -m pytest -q -n 2 --dist loadfile --reruns 4 --ignore=tests/emulator_tests/test_servicebus_functions.py tests/emulator_tests
        env:
          AzureWebJobsStorage: $(AzureWebJobsStorage)
          AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
          AzureWebJobsEventHubConnectionString: $(EmulatorEventHubConnectionString)
          AzureWebJobsCosmosDBConnectionString: $(EmulatorCosmosDBConnectionString)
          CosmosDBEmulatorUrl: $(CosmosDBEmulatorUrl)
          CosmosDBEmulatorKey: $(CosmosDBEmulatorKey)
        workingDirectory: $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}
        displayName: "Running $(PYTHON_VERSION) Python Linux Emulator Tests"
      - bash: |
          # Stop and remove EventHub Emulator container to free up the port
          docker stop eventhubs-emulator
          docker container rm --force eventhubs-emulator
          docker compose -f ${{ parameters.PROJECT_DIRECTORY }}/tests/emulator_tests/utils/servicebus/docker-compose.yml pull
          docker compose -f ${{ parameters.PROJECT_DIRECTORY }}/tests/emulator_tests/utils/servicebus/docker-compose.yml up -d

          # Wait for the Service Bus emulator (and its SQL Edge dependency) to
          # be ready before running tests. Starting the webhost while the
          # emulator is still booting makes the ServiceBus listener fail at
          # startup, so the host never binds and tests see connection refused.
          echo "Waiting for the Service Bus emulator to be ready..."
          for i in $(seq 1 90); do
            if docker logs servicebus-emulator 2>&1 | grep -q "Emulator Service is Successfully Up"; then
              echo "Service Bus emulator is ready."
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Service Bus emulator did not become ready in time. Logs:"
              docker logs servicebus-emulator || true
              exit 1
            fi
            sleep 2
          done
        env:
          AzureWebJobsSQLPassword: $(AzureWebJobsSQLPassword)
        displayName: 'Install Azurite and Start ServiceBus Emulator'
      - bash: |
            export PYTHONPATH="$(Build.SourcesDirectory)/servicebus_dir:$PYTHONPATH"
            python -m pytest -q --dist loadfile --reruns 4 tests/emulator_tests/test_servicebus_functions.py
        env:
          AzureWebJobsStorage: $(AzureWebJobsStorage)
          AzureWebJobsServiceBusConnectionString: $(EmulatorServiceBusConnectionString)
          AzureWebJobsServiceBusSDKConnectionString: $(AzureWebJobsServiceBusSDKConnectionString)
        workingDirectory: $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}
        displayName: "Running $(PYTHON_VERSION) Python ServiceBus Linux Emulator Tests"
      
      - bash: |
          echo "Cleaning up after tests..."
          # Stop and remove all Docker containers
          docker stop $(docker ps -aq) || true
          docker rm $(docker ps -aq) || true
          
          # Remove build artifacts and caches
          rm -rf $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}/build || true
          rm -rf $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}/.pytest_cache || true
          rm -rf $(Pipeline.Workspace)/PythonSdkArtifact || true
          rm -rf $(Pipeline.Workspace)/PythonExtensionArtifact || true
          
          # Clean Docker resources
          docker system prune -af --volumes || true
          
          # Clean pip cache
          pip cache purge || true
          
          echo "Disk space after cleanup:"
          df -h
        displayName: 'Cleanup after tests'
        condition: always()

  # Temporary - run Python 3.15 tests as a separate job. Dev deps do not have cp315 wheels yet.
  - job: "TestR2P2Emulator"
    displayName: "Run Python 3.15 R2P2 Emulator Tests"
    # Secret variables (emulator connection strings) are unavailable to PRs
    # from forks.
    condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))

    pool:
      name: ${{ parameters.PoolName }}
      image: 1es-ubuntu-24.04-min
      os: linux

    variables:
      PYTHON_VERSION: '3.15'

    steps:
      - task: PipAuthenticate@1
        displayName: 'Authenticate pip to CFS'
        inputs:
          artifactFeeds: 'public/upstream-public'
          onlyAddExtraIndex: false

      - bash: |
          echo "Disk space before cleanup:"
          df -h
          docker system prune -af --volumes || true
          pip cache purge || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          echo "Disk space after cleanup:"
          df -h
        displayName: 'Free disk space'

      - bash: |
          echo "Memory before cleanup:"
          free -h
          # Stop background services not needed for emulator tests. Docker must
          # remain running for the CosmosDB/EventHub emulators, so do NOT stop
          # docker, docker.socket, or containerd here.
          sudo systemctl stop snapd || true
          sudo systemctl stop unattended-upgrades || true
          sudo systemctl stop packagekit || true
          sudo sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true
          echo "Memory after cleanup:"
          free -h
        displayName: 'Free memory'

      - task: UsePythonVersion@0
        displayName: 'Use Python $(PYTHON_VERSION)'
        inputs:
          versionSpec: '3.15.0-rc.1'
          allowUnstable: true

      - bash: |
          set -euo pipefail
          # PyO3 (auto-initialize) links against libpython, so point the Rust
          # build at the interpreter UsePythonVersion selected, and put that
          # interpreter's libdir on LD_LIBRARY_PATH so the staged r2p2 binary
          # can load libpython3.15.so when the Host spawns it during the tests.
          PY="$(which python)"
          echo "##vso[task.setvariable variable=PYO3_PYTHON]$PY"
          LIBDIR="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          echo "##vso[task.setvariable variable=LD_LIBRARY_PATH]$LIBDIR:${LD_LIBRARY_PATH:-}"
          echo "PYO3_PYTHON=$PY LIBDIR=$LIBDIR"
          python --version
        displayName: 'Configure Python for PyO3'

      - bash: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "##vso[task.prependpath]$HOME/.cargo/bin"
        displayName: 'Install Rust toolchain'

      - task: CargoAuthenticate@0
        displayName: 'Authenticate Cargo to CFS'
        inputs:
          configFile: '$(Build.SourcesDirectory)/${{ parameters.CARGO_CONFIG_FILE }}'

      - bash: |
          set -euo pipefail
          rustc --version && cargo --version
          cargo_config='$(Build.SourcesDirectory)/${{ parameters.CARGO_CONFIG_FILE }}'
          chmod +x eng/scripts/prepare-cargo-auth.sh
          eng/scripts/prepare-cargo-auth.sh "$cargo_config"
          cargo --config "$cargo_config" build --release --locked
        displayName: 'Build R2P2 (cargo build --release)'
        workingDirectory: $(Build.SourcesDirectory)/workers/r2p2

      - task: UseDotNet@2
        displayName: 'Install .NET 10'
        inputs:
          version: 10.0.x
      - task: NuGetAuthenticate@1
        displayName: 'Authenticate NuGet to CFS'

      - bash: |
          set -euo pipefail
          # Minimal cp315-safe install. NOT workers/[dev] (opencv/pandas/
          # scikit-learn/aiohttp have no cp315 wheels). No grpcio: it has no
          # cp315 wheel and is not needed -- the R2P2 worker is protobuf-free
          # and the harness imports proxy_worker.protos lazily. protobuf ships
          # an abi3 wheel (backs the v1/v2 runtime's lazy google.protobuf
          # Timestamp converter). The emulator deps (azure-cosmos/azure-eventhub/
          # python-dateutil + the blob/cosmosdb deferred-binding extensions) all
          # ship universal py3 wheels. invoke drives the Host webhost/extensions
          # build; the editable v2/v1 runtimes back the R2P2 embedded interpreter.
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=62,<82.0"
          python -m pip install \
            "azure-functions==2.3.0b2" \
            "protobuf>=5.29,<7" "requests==2.*" \
            "pytest~=7.4.4" pytest-asyncio pytest-rerunfailures pytest-instafail \
            invoke \
            azure-cosmos azure-eventhub python-dateutil \
            azurefunctions-extensions-bindings-blob \
            azurefunctions-extensions-bindings-cosmosdb \
            -e runtimes/v2 -e runtimes/v1
        displayName: 'Install Python dependencies (cp315-safe)'

      - bash: |
          set -euo pipefail
          # Build the Host webhost + extensions. SKIP build-protos: grpcio-tools
          # has no cp315 wheel, and the R2P2 path needs no generated stubs --
          # the worker is protobuf-free and the harness imports
          # proxy_worker.protos lazily (tolerates their absence on 3.15).
          cd workers/tests
          python -m invoke -c test_setup webhost --branch-name=dev
          python -m invoke -c test_setup extensions
        displayName: 'Build webhost and extensions (skip build-protos)'

      - bash: |
          chmod +x eng/scripts/stage-r2p2.sh
          eng/scripts/stage-r2p2.sh
        displayName: 'Stage R2P2 worker'

      - bash: |
          # The minimal image (1es-ubuntu-24.04-min) does not ship the Docker
          # Compose v2 CLI plugin. Install it from the Ubuntu archive. This must
          # run BEFORE any emulator container is started: installing
          # docker-compose-v2 also upgrades moby-engine/moby-cli, which restarts
          # the Docker daemon and would kill already-running containers.
          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose v2 plugin not found; installing..."
            sudo apt-get update
            sudo apt-get install -y docker-compose-v2
          fi
          docker compose version
        displayName: 'Ensure Docker Compose v2 is installed'

      - bash: |
          docker system prune -af --volumes
          df -h
          docker pull mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
          docker run --detach --env ENABLE_EXPLORER=false --publish 8081:8081 mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
          docker ps
        displayName: "Start CosmosDB Emulator"

      - bash: |
          docker compose -f workers/tests/emulator_tests/utils/eventhub/docker-compose.yml pull
          docker compose -f workers/tests/emulator_tests/utils/eventhub/docker-compose.yml up -d
        displayName: 'Install Azurite and Start EventHub Emulator'

      - bash: |
          # Durable (azure-functions-durable -> aiohttp) and Service Bus (SDK
          # binding -> uamqp) have no cp315 wheels, so their suites are ignored
          # here. --continue-on-collection-errors is a safety net for any other
          # app whose third-party wheels are missing on 3.15.
          python -m pytest -q --reruns 4 --continue-on-collection-errors --instafail \
            --ignore=tests/emulator_tests/test_servicebus_functions.py \
            --ignore=tests/emulator_tests/test_durable_functions.py \
            tests/emulator_tests
        env:
          AzureWebJobsStorage: $(AzureWebJobsStorage)
          AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
          AzureWebJobsEventHubConnectionString: $(EmulatorEventHubConnectionString)
          AzureWebJobsCosmosDBConnectionString: $(EmulatorCosmosDBConnectionString)
          CosmosDBEmulatorUrl: $(CosmosDBEmulatorUrl)
          CosmosDBEmulatorKey: $(CosmosDBEmulatorKey)
          PYAZURE_WORKER_DIR: $(Build.SourcesDirectory)/workers/python/test_r2p2
          PYTHONPATH: $(Build.SourcesDirectory)/workers
          PYAZURE_WEBHOST_DEBUG: true
        workingDirectory: $(Build.SourcesDirectory)/workers
        displayName: "Running Python 3.15 R2P2 Emulator Tests"

      - bash: |
          echo "Cleaning up after tests..."
          docker stop $(docker ps -aq) || true
          docker rm $(docker ps -aq) || true
          rm -rf $(Build.SourcesDirectory)/workers/build || true
          rm -rf $(Build.SourcesDirectory)/workers/.pytest_cache || true
          rm -rf $(Build.SourcesDirectory)/workers/python/test_r2p2 || true
          rm -rf $(Build.SourcesDirectory)/workers/r2p2/target || true
          docker system prune -af --volumes || true
          pip cache purge || true
          echo "Disk space after cleanup:"
          df -h
        displayName: 'Cleanup after R2P2 emulator tests'
        condition: always()
