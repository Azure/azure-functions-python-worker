[registries]
PythonWorker_PublicPackages = { index = "sparse+https://azfunc.pkgs.visualstudio.com/public/_packaging/PythonWorker_PublicPackages/Cargo/index/" }

[source.crates-io]
replace-with = "PythonWorker_PublicPackages"

# Enable Control Flow Guard and ASLR for all Windows MSVC architectures.
[target.'cfg(all(target_os = "windows", target_env = "msvc"))']
rustflags = ["-Ccontrol-flow-guard=yes", "-Clink-arg=/DYNAMICBASE"]
