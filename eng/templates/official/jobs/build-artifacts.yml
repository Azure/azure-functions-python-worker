# R2P2 (Python 3.15+). The R2P2 is a native binary that embeds CPython via
# PyO3, so — unlike the pure-Python proxy/legacy workers — every OS must
# compile it with cargo on a *native* agent with outbound access to crates.io.
# That is why these jobs run on the *public* pool (the secure 1es-pool-azfunc
# has no internet). Each job produces the same 3.15_<OS>_<ARCH> artifact that
# the V4 nuspec packs into tools/3.15/<OS>/<Arch>, so the R2P2 ships inside the
# single Python worker NuGet. Windows Arm64 is new for 3.15 (unsupported by the
# Python transport workers on <=3.14).
- job: Build_R2P2_LINUX_X64
  timeoutInMinutes: 180
  pool:
    name: 1es-pool-azfunc-public
    image: 1es-ubuntu-22.04
    os: linux
  strategy:
    matrix:
      Python315R2P2:
        pythonVersion: '3.15.0-rc.1'
        normalizedPythonVersion: '3.15'
  templateContext:
    outputParentDirectory: $(Build.ArtifactStagingDirectory)
    outputs:
      - output: pipelineArtifact
        targetPath: $(Build.ArtifactStagingDirectory)
        artifactName: "$(normalizedPythonVersion)_LINUX_X64"
  steps:
  - template: ../../../pack/templates/r2p2_env_gen.yml
    parameters:
      pythonVersion: '$(pythonVersion)'
      artifactName: '$(normalizedPythonVersion)_LINUX_X64'
      osName: 'LINUX'
