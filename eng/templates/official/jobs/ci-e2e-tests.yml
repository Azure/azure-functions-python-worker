parameters:
  PROJECT_DIRECTORY: 'workers'
  

jobs:
  - job: "TestPython"
    displayName: "Run Python E2E Tests"

    pool:
      name: 1es-pool-azfunc
      image: 1es-ubuntu-24.04-min
      os: linux

    strategy:
      matrix:
        Python310:
          PYTHON_VERSION: '3.10'
          STORAGE_CONNECTION: $(LinuxStorageConnectionString310)
          SQL_CONNECTION: $(LinuxSqlConnectionString310)
          EVENTGRID_URI: $(LinuxEventGridTopicUriString310)
          EVENTGRID_CONNECTION: $(LinuxEventGridConnectionKeyString310)
        Python311:
          PYTHON_VERSION: '3.11'
          STORAGE_CONNECTION: $(LinuxStorageConnectionString311)
          SQL_CONNECTION: $(LinuxSqlConnectionString311)
          EVENTGRID_URI: $(LinuxEventGridTopicUriString311)
          EVENTGRID_CONNECTION: $(LinuxEventGridConnectionKeyString311)
        Python312:
          PYTHON_VERSION: '3.12'
          STORAGE_CONNECTION: $(LinuxStorageConnectionString312)
          SQL_CONNECTION: $(LinuxSqlConnectionString312)
          EVENTGRID_URI: $(LinuxEventGridTopicUriString312)
          EVENTGRID_CONNECTION: $(LinuxEventGridConnectionKeyString312)
        Python313:
          PYTHON_VERSION: '3.13'
          STORAGE_CONNECTION: $(LinuxStorageConnectionString37)
          SQL_CONNECTION: $(LinuxSqlConnectionString37)
          EVENTGRID_URI: $(LinuxEventGridTopicUriString37)
          EVENTGRID_CONNECTION: $(LinuxEventGridConnectionKeyString37)
        Python314:
          PYTHON_VERSION: '3.14'
          STORAGE_CONNECTION: $(LinuxStorageConnectionString38)
          SQL_CONNECTION: $(LinuxSqlConnectionString38)
          EVENTGRID_URI: $(LinuxEventGridTopicUriString38)
          EVENTGRID_CONNECTION: $(LinuxEventGridConnectionKeyString38)
    steps:
      - task: PipAuthenticate@1
        displayName: 'Authenticate pip to CFS'
        inputs:
          artifactFeeds: 'public/upstream-public'
          onlyAddExtraIndex: false
      - bash: |
          echo "Disk space before cleanup:"
          df -h
          
          # Clean up Docker resources
          docker system prune -af --volumes || true
          
          # Clean pip cache
          pip cache purge || true
          
          # Clean apt cache
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          
          echo "Disk space after cleanup:"
          df -h
        displayName: 'Free disk space'

      - bash: |
          # The minimal image (1es-ubuntu-24.04-min) does not ship the system
          # libraries that opencv-python (cv2) needs at import time, e.g.
          # libGL.so.1 and libgthread-2.0.so.0. Install them so the endtoend
          # opencv_func test can load cv2.
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
        displayName: 'Install system libraries for opencv (cv2)'

      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(PYTHON_VERSION)
      - task: UseDotNet@2
        displayName: 'Install .NET 10'
        inputs:
          version: 10.0.x
      - task: NuGetAuthenticate@1
        displayName: 'Authenticate NuGet to CFS'
      - bash: |
          chmod +x eng/scripts/install-dependencies.sh
          eng/scripts/install-dependencies.sh $(PYTHON_VERSION) ${{ parameters.PROJECT_DIRECTORY }}
        displayName: 'Install Python dependencies (uv)'
        condition: and(eq(variables.isSdkRelease, false), eq(variables.isExtensionsRelease, false), eq(variables['USETESTPYTHONSDK'], false), eq(variables['USETESTPYTHONEXTENSIONS'], false))
      - bash: |
          chmod +x eng/scripts/test-setup.sh
          eng/scripts/test-setup.sh
        displayName: 'Build webhost and extensions (dotnet)'
        condition: and(eq(variables.isSdkRelease, false), eq(variables.isExtensionsRelease, false), eq(variables['USETESTPYTHONSDK'], false), eq(variables['USETESTPYTHONEXTENSIONS'], false))
      - task: DownloadPipelineArtifact@2
        displayName: 'Download Python SDK Artifact'
        inputs:
          buildType: specific
          artifactName: 'azure-functions'
          project: 'internal'
          definition: 679
          buildVersionToDownload: latest
          targetPath: '$(Pipeline.Workspace)/PythonSdkArtifact'
        condition: or(eq(variables.isSdkRelease, true), eq(variables['USETESTPYTHONSDK'], true))
      - bash: |
          chmod +x eng/scripts/test-sdk.sh
          chmod +x eng/scripts/test-setup.sh

          eng/scripts/test-sdk.sh $(Pipeline.Workspace) $(PYTHON_VERSION)
          eng/scripts/test-setup.sh
        displayName: 'Install test python sdk, dependencies and the worker'
        condition: or(eq(variables.isSdkRelease, true), eq(variables['USETESTPYTHONSDK'], true))
      - task: DownloadPipelineArtifact@2
        displayName: 'Download Python Extension Artifact'
        inputs:
          buildType: specific
          artifactName: $(PYTHONEXTENSIONNAME)
          project: 'internal'
          definition: 798
          buildVersionToDownload: latest
          targetPath: '$(Pipeline.Workspace)/PythonExtensionArtifact'
        condition: or(eq(variables.isExtensionsRelease, true), eq(variables['USETESTPYTHONEXTENSIONS'], true))
      - bash: |
          chmod +x eng/scripts/test-setup.sh
          chmod +x eng/scripts/test-extensions.sh

          eng/scripts/test-extensions.sh $(Pipeline.Workspace) $(PYTHON_VERSION) $(PYTHONEXTENSIONNAME)
          eng/scripts/test-setup.sh
        displayName: 'Install test python extension, dependencies and the worker'
        condition: or(eq(variables.isExtensionsRelease, true), eq(variables['USETESTPYTHONEXTENSIONS'], true))
      - powershell: |
          $pipelineVarSet = "$(USETESTPYTHONSDK)"
          Write-Host "pipelineVarSet: $pipelineVarSet"
          $branch = "$(Build.SourceBranch)"
          Write-Host "Branch: $branch"
          
          $PY_VER = "$(PYTHON_VERSION)"
          Write-Host "Python version: $PY_VER"
          # Extract minor version as integers
          $versionParts = $PY_VER.Split('.')
          $PY_MINOR = [int]$versionParts[1]
          Write-Host "Minor version: $PY_MINOR"

          if($branch.StartsWith("refs/heads/sdk/") -or $pipelineVarSet -eq "true" -or $PY_MINOR -ge 13 )
          {
            Write-Host "##vso[task.setvariable variable=skipTest;]true"
          }
          else
          {
            Write-Host "##vso[task.setvariable variable=skipTest;]false"
          }
        displayName: 'Set skipTest variable'
      - powershell: |
          Write-Host "skipTest: $(skipTest)"
        displayName: 'Display skipTest variable'
      - bash: |
             python -m pytest -q --dist loadfile --reruns 4 --cov=./azure_functions_worker --cov-report xml --cov-branch --cov-append tests/endtoend
        env:
          AzureWebJobsStorage: $(STORAGE_CONNECTION)
          STORAGE_CONNECTION: $(STORAGE_CONNECTION)
          AzureWebJobsSqlConnectionString: $(SQL_CONNECTION)
          AzureWebJobsEventGridTopicUri: $(EVENTGRID_URI)
          AzureWebJobsEventGridConnectionKey: $(EVENTGRID_CONNECTION)
          skipTest: $(skipTest)
          PYAZURE_WEBHOST_DEBUG: true
        displayName: "Running $(PYTHON_VERSION) Python E2E Tests"
        workingDirectory: $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}
      
      - bash: |
          echo "Cleaning up after tests..."
          # Remove build artifacts and caches
          rm -rf $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}/build || true
          rm -rf $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}/.pytest_cache || true
          rm -rf $(Pipeline.Workspace)/PythonSdkArtifact || true
          rm -rf $(Pipeline.Workspace)/PythonExtensionArtifact || true
          
          # Clean Docker
          docker system prune -f || true
          
          # Clean pip cache
          pip cache purge || true
          
          echo "Disk space after cleanup:"
          df -h
        displayName: 'Cleanup after tests'
        condition: always()

 # Temporary - run Python 3.15 tests as a separate job. Dev deps do not have cp315 wheels yet.
  - job: "TestR2P2E2E"
    displayName: "Run Python 3.15 R2P2 E2E Tests"

    pool:
      name: 1es-pool-azfunc
      image: 1es-ubuntu-24.04-min
      os: linux

    variables:
      PYTHON_VERSION: '3.15'
      STORAGE_CONNECTION: $(LinuxStorageConnectionString38)
      SQL_CONNECTION: $(LinuxSqlConnectionString38)
      EVENTGRID_URI: $(LinuxEventGridTopicUriString38)
      EVENTGRID_CONNECTION: $(LinuxEventGridConnectionKeyString38)

    steps:
      - task: PipAuthenticate@1
        displayName: 'Authenticate pip to CFS'
        inputs:
          artifactFeeds: 'public/upstream-public'
          onlyAddExtraIndex: false

      - bash: |
          echo "Disk space before cleanup:"
          df -h
          docker system prune -af --volumes || true
          pip cache purge || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          echo "Disk space after cleanup:"
          df -h
        displayName: 'Free disk space'

      - task: UsePythonVersion@0
        displayName: 'Use Python $(PYTHON_VERSION)'
        inputs:
          versionSpec: '3.15.0-rc.1'
          allowUnstable: true

      - bash: |
          set -euo pipefail
          # PyO3 (auto-initialize) links against libpython, so point the Rust
          # build at the interpreter UsePythonVersion selected, and put that
          # interpreter's libdir on LD_LIBRARY_PATH so the staged r2p2 binary
          # can load libpython3.15.so when the Host spawns it during the tests.
          PY="$(which python)"
          echo "##vso[task.setvariable variable=PYO3_PYTHON]$PY"
          LIBDIR="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          echo "##vso[task.setvariable variable=LD_LIBRARY_PATH]$LIBDIR:${LD_LIBRARY_PATH:-}"
          echo "PYO3_PYTHON=$PY LIBDIR=$LIBDIR"
          python --version
        displayName: 'Configure Python for PyO3'

      - bash: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "##vso[task.prependpath]$HOME/.cargo/bin"
        displayName: 'Install Rust toolchain'

      - task: CargoAuthenticate@0
        displayName: 'Authenticate Cargo to CFS'
        inputs:
          configFile: '$(Build.SourcesDirectory)/workers/r2p2/.cargo/config.toml'

      - bash: |
          set -euo pipefail
          rustc --version && cargo --version
          cargo build --release --locked
        displayName: 'Build R2P2 (cargo build --release)'
        workingDirectory: $(Build.SourcesDirectory)/workers/r2p2

      - task: UseDotNet@2
        displayName: 'Install .NET 10'
        inputs:
          version: 10.0.x
      - task: NuGetAuthenticate@1
        displayName: 'Authenticate NuGet to CFS'

      - bash: |
          set -euo pipefail
          # Minimal cp315-safe install. NOT workers/[dev] (opencv/pandas/
          # scikit-learn/aiohttp have no cp315 wheels). No grpcio: it has no
          # cp315 wheel and is not needed -- the R2P2 worker is protobuf-free
          # (Rust/prost owns the wire) and the pytest harness imports
          # proxy_worker.protos lazily (absent on 3.15 -> protos=None). protobuf
          # ships an abi3 wheel and backs the v2/v1 runtime's lazy
          # google.protobuf Timestamp converter. invoke drives the Host
          # webhost/extensions build. The R2P2's embedded interpreter imports
          # the v2/v1 runtimes from these editable installs.
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=62,<82.0"
          python -m pip install \
            "azure-functions==2.3.0b2" \
            "protobuf>=5.29,<7" "requests==2.*" \
            "pytest~=7.4.4" pytest-asyncio pytest-rerunfailures pytest-instafail \
            invoke \
            -e runtimes/v2 -e runtimes/v1
        displayName: 'Install Python dependencies (cp315-safe)'

      - bash: |
          set -euo pipefail
          # Build the Host webhost + extensions. SKIP build-protos: grpcio-tools
          # has no cp315 wheel, and the R2P2 path needs no generated stubs --
          # the worker is protobuf-free and the harness imports
          # proxy_worker.protos lazily (tolerates their absence on 3.15).
          cd workers/tests
          python -m invoke -c test_setup webhost --branch-name=dev
          python -m invoke -c test_setup extensions
        displayName: 'Build webhost and extensions (skip build-protos)'

      - bash: |
          chmod +x eng/scripts/stage-r2p2.sh
          eng/scripts/stage-r2p2.sh
        displayName: 'Stage R2P2 worker'

      - bash: |
          python -m pytest -q --reruns 4 --continue-on-collection-errors --instafail tests/endtoend
        env:
          AzureWebJobsStorage: $(STORAGE_CONNECTION)
          STORAGE_CONNECTION: $(STORAGE_CONNECTION)
          AzureWebJobsSqlConnectionString: $(SQL_CONNECTION)
          AzureWebJobsEventGridTopicUri: $(EVENTGRID_URI)
          AzureWebJobsEventGridConnectionKey: $(EVENTGRID_CONNECTION)
          PYAZURE_WORKER_DIR: $(Build.SourcesDirectory)/workers/python/test_r2p2
          PYTHONPATH: $(Build.SourcesDirectory)/workers
          PYAZURE_WEBHOST_DEBUG: true
        displayName: "Running Python 3.15 R2P2 E2E Tests"
        workingDirectory: $(Build.SourcesDirectory)/workers

      - bash: |
          echo "Cleaning up after tests..."
          rm -rf $(Build.SourcesDirectory)/workers/build || true
          rm -rf $(Build.SourcesDirectory)/workers/.pytest_cache || true
          rm -rf $(Build.SourcesDirectory)/workers/python/test_r2p2 || true
          rm -rf $(Build.SourcesDirectory)/workers/r2p2/target || true
          docker system prune -f || true
          pip cache purge || true
          echo "Disk space after cleanup:"
          df -h
        displayName: 'Cleanup after tests'
        condition: always()
