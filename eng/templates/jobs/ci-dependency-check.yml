parameters:
  CARGO_CONFIG_FILE: 'workers/r2p2/.cargo/config.toml'

jobs:
  - job: "TestPython"
    displayName: "Run Dependency Checks"

    pool:
      name: ${{ parameters.PoolName }}
      image: 1es-ubuntu-24.04-min
      os: linux

    strategy:
      matrix:
        Python310:
          PYTHON_VERSION: '3.10'
        Python311:
          PYTHON_VERSION: '3.11'
        Python312:
          PYTHON_VERSION: '3.12'
        Python313:
          PYTHON_VERSION: '3.13'
        Python314:
          PYTHON_VERSION: '3.14'
        Python315:
          PYTHON_VERSION: '3.15.0-rc.1'
    steps:
      - task: PipAuthenticate@1
        displayName: 'Authenticate pip to CFS'
        inputs:
          artifactFeeds: 'public/upstream-public'
          onlyAddExtraIndex: false
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(PYTHON_VERSION)
          allowUnstable: true
      - powershell: |
          $PY_VER = "$(PYTHON_VERSION)"
          Write-Host "Python version: $PY_VER"

          # Extract minor version as integers
          $versionParts = $PY_VER.Split('.')
          $PY_MINOR = [int]$versionParts[1]
          Write-Host "Minor version: $PY_MINOR"
          Write-Host "##vso[task.setvariable variable=minorVersion;]$PY_MINOR"

          # Set build-related variables based on Python minor version
          if( $PY_MINOR -ge 15 )
          {
            Write-Host "##vso[task.setvariable variable=proxyWorker;]false"
            Write-Host "##vso[task.setvariable variable=r2p2Worker;]true"
          }
          elseif( $PY_MINOR -ge 13 )
          {
            Write-Host "##vso[task.setvariable variable=proxyWorker;]true"
            Write-Host "##vso[task.setvariable variable=r2p2Worker;]false"
          }
          else
          {
            Write-Host "##vso[task.setvariable variable=proxyWorker;]false"
            Write-Host "##vso[task.setvariable variable=r2p2Worker;]false"
          }
        displayName: 'Set necessary variables'
      - bash: |
            echo "Checking azure_functions_worker (Python < 3.13)..."
            if [ -n "${PIP_INDEX_URL:-}" ] && [ -z "${UV_DEFAULT_INDEX:-}" ]; then
              export UV_DEFAULT_INDEX="$PIP_INDEX_URL"
            fi
            cd workers
            python -m pip install --upgrade pip
            python -m pip install uv
            python -m uv pip install --system "setuptools<82.0"
            python -m uv pip install --system . invoke
            cd tests
            python -m invoke -c test_setup build-protos
            cd ..
            python -c "import pkgutil, importlib; [importlib.import_module(f'azure_functions_worker.{name}') for _, name, _ in pkgutil.walk_packages(['azure_functions_worker'])]"
        displayName: 'Python Azure Functions Worker: check for missing dependencies'
        condition: and(eq(variables['proxyWorker'], false), eq(variables['r2p2Worker'], false))
      - bash: |
            echo "Checking proxy_worker (Python >= 3.13)..."
            if [ -n "${PIP_INDEX_URL:-}" ] && [ -z "${UV_DEFAULT_INDEX:-}" ]; then
              export UV_DEFAULT_INDEX="$PIP_INDEX_URL"
            fi
            cd workers
            python -m pip install --upgrade pip
            python -m pip install uv
            python -m uv pip install --system . invoke
            cd tests
            python -m invoke -c test_setup build-protos
            cd ..
            python -c "import pkgutil, importlib; [importlib.import_module(f'proxy_worker.{name}') for _, name, _ in pkgutil.walk_packages(['proxy_worker'])]"
        displayName: 'Python Proxy Worker: check for missing dependencies'
        condition: eq(variables['proxyWorker'], true)
      - bash: |
            echo "Checking V1 Library Worker (Python >= 3.13)..."
            if [ -n "${PIP_INDEX_URL:-}" ] && [ -z "${UV_DEFAULT_INDEX:-}" ]; then
              export UV_DEFAULT_INDEX="$PIP_INDEX_URL"
            fi
            cd runtimes/v1
            python -m pip install --upgrade pip
            python -m pip install uv
            python -m uv pip install --system .
            python -c "import pkgutil, importlib; [importlib.import_module(f'azure_functions_runtime_v1.{name}') for _, name, _ in pkgutil.walk_packages(['azure_functions_runtime_v1'])]"
        displayName: 'Python Library V1: check for missing dependencies'
        condition: or(eq(variables['proxyWorker'], true), eq(variables['r2p2Worker'], true))
      - bash: |
            echo "Checking V2 Library Worker (Python >= 3.13)..."
            if [ -n "${PIP_INDEX_URL:-}" ] && [ -z "${UV_DEFAULT_INDEX:-}" ]; then
              export UV_DEFAULT_INDEX="$PIP_INDEX_URL"
            fi
            cd runtimes/v2
            python -m pip install --upgrade pip
            python -m pip install uv
            python -m uv pip install --system .
            python -c "import pkgutil, importlib; [importlib.import_module(f'azure_functions_runtime.{name}') for _, name, _ in pkgutil.walk_packages(['azure_functions_runtime'])]"
        displayName: 'Python Library V2: check for missing dependencies'
        condition: or(eq(variables['proxyWorker'], true), eq(variables['r2p2Worker'], true))
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          if (Get-Command rustup -ErrorAction SilentlyContinue) {
            rustup update stable
            rustup default stable
          } else {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            $env:PATH = "$HOME/.cargo/bin`:$env:PATH"
            Write-Host "##vso[task.prependpath]$HOME/.cargo/bin"
          }
        displayName: 'Install Rust toolchain'
        condition: eq(variables['r2p2Worker'], true)
      - task: CargoAuthenticate@0
        displayName: 'Authenticate Cargo to CFS'
        inputs:
          configFile: '$(Build.SourcesDirectory)/${{ parameters.CARGO_CONFIG_FILE }}'
        condition: eq(variables['r2p2Worker'], true)
      - bash: |
          chmod +x '$(Build.SourcesDirectory)/eng/scripts/prepare-cargo-auth.sh'
          '$(Build.SourcesDirectory)/eng/scripts/prepare-cargo-auth.sh' '$(Build.SourcesDirectory)/${{ parameters.CARGO_CONFIG_FILE }}'
        displayName: 'Validate Cargo authentication'
        condition: eq(variables['r2p2Worker'], true)
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          Push-Location workers/r2p2
          try {
            cargo --config '$(Build.SourcesDirectory)/${{ parameters.CARGO_CONFIG_FILE }}' metadata --locked --format-version 1 --no-deps | Out-Null
          } finally {
            Pop-Location
          }
        displayName: 'R2P2: check Cargo dependency resolution'
        condition: eq(variables['r2p2Worker'], true)
