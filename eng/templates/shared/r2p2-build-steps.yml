parameters:
  PYTHON_VERSION: ''
  PROJECT_NAME: ''
  PROJECT_DIRECTORY: 'workers/r2p2'
  CARGO_CONFIG_FILE: 'workers/r2p2/.cargo/config.toml'

steps:
  - task: PipAuthenticate@1
    displayName: 'Authenticate pip to CFS'
    inputs:
      artifactFeeds: 'public/upstream-public'
      onlyAddExtraIndex: false
  - task: UsePythonVersion@0
    displayName: 'Use Python ${{ parameters.PYTHON_VERSION }}'
    inputs:
      versionSpec: ${{ parameters.PYTHON_VERSION }}
      allowUnstable: true

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      python --version
      # PyO3 (auto-initialize) links against libpython, so point it at the
      # interpreter selected by UsePythonVersion.
      $py = (Get-Command python).Source
      Write-Host "##vso[task.setvariable variable=PYO3_PYTHON]$py"
      $libdir = python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR') or '')"
      Write-Host "##vso[task.setvariable variable=LD_LIBRARY_PATH]$libdir`:$env:LD_LIBRARY_PATH"
      Write-Host "PYO3_PYTHON=$py libdir=$libdir"
    displayName: 'Configure Python for PyO3'

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      if (Get-Command rustup -ErrorAction SilentlyContinue) {
        rustup update stable
        rustup default stable
      } else {
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        Write-Host "##vso[task.prependpath]$HOME/.cargo/bin"
      }
    displayName: 'Install Rust toolchain'

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      rustc --version
      cargo --version
    displayName: 'Check Rust versions'

  - task: CargoAuthenticate@0
    displayName: 'Authenticate Cargo to CFS'
    inputs:
      configFile: '$(Build.SourcesDirectory)/${{ parameters.CARGO_CONFIG_FILE }}'

  - bash: |
      chmod +x eng/scripts/prepare-cargo-auth.sh
      eng/scripts/prepare-cargo-auth.sh '$(Build.SourcesDirectory)/${{ parameters.CARGO_CONFIG_FILE }}'
    displayName: 'Validate Cargo authentication'

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      cargo --config '$(Build.SourcesDirectory)/${{ parameters.CARGO_CONFIG_FILE }}' build --locked
    displayName: 'Build R2P2 worker'
    workingDirectory: $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}
