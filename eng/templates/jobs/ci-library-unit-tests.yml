parameters:
  PROJECT_NAME: ''
  PROJECT_DIRECTORY: ''
  ArtifactFeed: ''

jobs:
  - job: "TestPython"
    displayName: "Run ${{ parameters.PROJECT_NAME }} Unit Tests"

    pool:
      name: ${{ parameters.PoolName }}
      image: 1es-ubuntu-22.04
      os: linux
    
    strategy:
      matrix:
        Python313:
          PYTHON_VERSION: '3.13'
    
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(PYTHON_VERSION)
      - task: PipAuthenticate@1
        displayName: 'Pip Authenticate'
        inputs:
          artifactFeeds: ${{ parameters.ArtifactFeed }}
      - task: UseDotNet@2
        displayName: 'Install .NET 10'
        inputs:
          version: 10.0.x
      - bash: |
          chmod +x eng/scripts/install-dependencies.sh          
          eng/scripts/install-dependencies.sh $(PYTHON_VERSION) ${{ parameters.PROJECT_DIRECTORY }}
        displayName: 'Install dependencies'
      - bash: |
          python -m pytest -q --dist loadfile --reruns 4 --instafail --cov=./${{ parameters.PROJECT_DIRECTORY }} --cov-report xml --cov-branch tests/unittests
        displayName: "Running $(PYTHON_VERSION) Unit Tests"
        env:
          AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
        workingDirectory: $(Build.SourcesDirectory)/${{ parameters.PROJECT_DIRECTORY }}