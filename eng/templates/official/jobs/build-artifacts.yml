jobs:
  - job: "Build"
    displayName: 'Build Python Library Worker'

    pool:
      name: 1es-pool-azfunc
      image: 1es-ubuntu-22.04
      os: linux

    variables:
      # Extract the version number from the branch name
      pythonVersion: $[substring(variables['Build.SourceBranchName'], 4, 2)]  # Extract last two digits from dev-xxx

    templateContext:
      outputParentDirectory: $(Build.c)
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/dist
          artifactName: "azure-functions-worker"

    steps:
      - script: |
          echo "Branch name: $(Build.SourceBranchName)"
          # Extract the last two digits (minor version) from the branch name
          version=$(echo $(Build.SourceBranchName) | sed 's/dev-\([0-9]*\)/\1/')
          minor_version=${version: -2}  # Get last two digits

          # Check if minor_version is a number; if not, set default to 13
          if ! [[ "$minor_version" =~ ^[0-9]+$ ]]; then
            minor_version=13
          fi

          echo "Extracted minor version: $minor_version"
          echo "##vso[task.setvariable variable=pythonVersion]$minor_version"
        displayName: 'Extract Python version from branch name'
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.$(pythonVersion)'
      - bash: |
          python --version
        displayName: 'Check python version'
      - bash: |
          python -m pip install -U pip
          python -m pip install build
          python -m build
        displayName: 'Build Python Library Worker'
      - script: |
          echo "Contents of dist folder:"
          ls -al $(Build.SourcesDirectory)/dist
        displayName: 'Verify dist folder contents'
      - script: |
          echo "Branch name: $(Build.SourceBranchName)"
          # Extract the part after the slash (release/<package_version>-<python_version>)
          branch_name=$(echo $(Build.SourceBranchName) | sed 's/refs\/heads\///')
          
          # Extract the package version (everything before the first dash)
          package_version=$(echo $branch_name | sed 's|^release/\([^/]*\)-.*|\1|')

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-zA-Z]+[0-9]*)?$ ]]; then
            echo "Invalid package version detected. Setting to default: 1.0.0a13"
            package_version="1.0.0"
          fi
          
          # Print the extracted package version
          echo "Extracted package version: $package_version"
          
          # Set the package version as a pipeline variable
          echo "##vso[task.setvariable variable=packageVersion]$package_version"
        displayName: 'Extract Package Version from Branch Name'
      - script: |
          wheel_file=$(ls $(Build.SourcesDirectory)/dist/*.whl)
          new_wheel_name="azure-functions-worker-$(packageVersion)-py3$(pythonVersion)-none-any.whl"
          mv "$wheel_file" "$(Build.SourcesDirectory)/dist/$new_wheel_name"
      - bash: |
          pip install pip-audit
          pip-audit .
        displayName: 'Run vulnerability scan'
