pr: none

parameters:
  - name: WorkerRelease
    displayName: 'Worker Release (Nuget)'
    type: boolean
    default: false
  - name: V1LibraryRelease
    displayName: 'V1 Library Release (PyPI)'
    type: boolean
    default: false
  - name: V2LibraryRelease
    displayName: 'V2 Library Release (PyPI)'
    type: boolean
    default: false
  - name: ReleaseVersion
    displayName: 'Version to release (e.g., 0.1.0). Applies to whichever release is selected above (Worker, V1, or V2).'
    type: string
    default: ''

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release

variables:
  - name: codeql.excludePathPatterns
    value: deps/,build/
  # Maps the single ReleaseVersion parameter to the worker release, which
  # consumes it via the $(NewWorkerVersion) pipeline variable.
  - name: NewWorkerVersion
    value: ${{ parameters.ReleaseVersion }}

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows

    stages:
      - stage: ReleasePythonWorker
        displayName: 'Release Python Worker (Nuget)'
        jobs:
          - template: /eng/templates/official/jobs/publish-release.yml@self
        condition: eq(${{ parameters.WorkerRelease }}, True)
      - stage: ReleasePythonV2Library_BumpVersion
        dependsOn: []
        displayName: 'V2 Library - Bump Version'
        condition: eq(${{ parameters.V2LibraryRelease }}, True)
        jobs:
          - template: /eng/templates/official/release/bump-version.yml@self
            parameters:
              libraryVersion: ${{ parameters.ReleaseVersion }}
              projectDisplayName: 'Azure Functions Runtime V2'
              versionFilePath: 'runtimes/v2/azure_functions_runtime/version.py'
              releaseBranchPrefix: 'release-v2'
              createPullRequest: true
              baseBranch: 'dev'
      - stage: ReleasePythonV2Library_Build
        dependsOn: ReleasePythonV2Library_BumpVersion
        displayName: 'V2 Library - Build'
        condition: eq(${{ parameters.V2LibraryRelease }}, True)
        jobs:
          - template: /eng/templates/official/release/build-artifacts.yml@self
            parameters:
              artifactName: 'azure-functions-runtime'
              projectDisplayName: 'Azure Functions Runtime V2'
              libraryVersion: ${{ parameters.ReleaseVersion }}
              releaseBranchPrefix: 'release-v2'
              projectDirectory: 'runtimes/v2'
      - stage: ReleasePythonV2Library_Release
        dependsOn: ReleasePythonV2Library_Build
        displayName: 'V2 Library - Release (PyPI)'
        condition: eq(${{ parameters.V2LibraryRelease }}, True)
        jobs:
          - template: /eng/templates/official/release/publish-release.yml@self
            parameters:
              libraryVersion: ${{ parameters.ReleaseVersion }}
              projectDisplayName: 'Azure Functions Runtime V2'
              releaseBranchPrefix: 'release-v2'
              tagPrefix: 'runtimes/v2-'
              blobPath: 'azure-functions/python/azure-functions-runtime'
              artifactName: 'azure-functions-runtime'
      - stage: ReleasePythonV1Library_BumpVersion
        dependsOn: []
        displayName: 'V1 Library - Bump Version'
        condition: eq(${{ parameters.V1LibraryRelease }}, True)
        jobs:
          - template: /eng/templates/official/release/bump-version.yml@self
            parameters:
              libraryVersion: ${{ parameters.ReleaseVersion }}
              projectDisplayName: 'Azure Functions Runtime V1'
              versionFilePath: 'runtimes/v1/azure_functions_runtime_v1/version.py'
              releaseBranchPrefix: 'release-v1'
              createPullRequest: true
              baseBranch: 'dev'
      - stage: ReleasePythonV1Library_Build
        dependsOn: ReleasePythonV1Library_BumpVersion
        displayName: 'V1 Library - Build'
        condition: eq(${{ parameters.V1LibraryRelease }}, True)
        jobs:
          - template: /eng/templates/official/release/build-artifacts.yml@self
            parameters:
              artifactName: 'azure-functions-runtime-v1'
              projectDisplayName: 'Azure Functions Runtime V1'
              libraryVersion: ${{ parameters.ReleaseVersion }}
              releaseBranchPrefix: 'release-v1'
              projectDirectory: 'runtimes/v1'
      - stage: ReleasePythonV1Library_Release
        dependsOn: ReleasePythonV1Library_Build
        displayName: 'V1 Library - Release (PyPI)'
        condition: eq(${{ parameters.V1LibraryRelease }}, True)
        jobs:
          - template: /eng/templates/official/release/publish-release.yml@self
            parameters:
              libraryVersion: ${{ parameters.ReleaseVersion }}
              projectDisplayName: 'Azure Functions Runtime V1'
              releaseBranchPrefix: 'release-v1'
              tagPrefix: 'runtimes/v1-'
              blobPath: 'azure-functions/python/azure-functions-runtime-v1'
              artifactName: 'azure-functions-runtime-v1'