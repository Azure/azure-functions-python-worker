trigger: # run for sdk and extension release branches
  batch: true
  branches:
    include:
      - sdk/*
      - extensions/*

pr:
  branches:
    include:
    - dev
    - release*

schedules:
  - cron: "0 8 * * 1,2,3,4,5"
    displayName: Monday to Friday 3 AM CST build
    branches:
      include:
        - dev
    always: true

resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  - repository: eng
    type: git
    name: engineering
    ref: refs/tags/release

variables:
  - template: /eng/templates/utils/variables.yml@self
  - template: /eng/templates/utils/official-variables.yml@self

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows
    settings:
      clean: all  # Clean all build directories before starting

    stages:
    - stage: BuildPythonWorker
      jobs:
        - template: /eng/templates/official/jobs/build-artifacts.yml@self
