jobs:
- job: Build_RUST_LINUX_X64
  timeoutInMinutes: 180
  pool:
    name: 1es-pool-azfunc
    image: 1es-ubuntu-22.04
    os: linux
  strategy:
    matrix:
      # The Rust binary embeds one CPython ABI; add versions as new CPython
      # lines are supported by the worker.
      Python314Rust:
        pythonVersion: '3.14'
        normalizedPythonVersion: '3.14'
  templateContext:
    outputParentDirectory: $(Build.ArtifactStagingDirectory)
    outputs:
      - output: pipelineArtifact
        targetPath: $(Build.ArtifactStagingDirectory)
        artifactName: "$(normalizedPythonVersion)_RUST_LINUX_X64"
  steps:
  - template: ../../../pack/templates/rust_env_gen.yml
    parameters:
      pythonVersion: '$(pythonVersion)'
      artifactName: '$(normalizedPythonVersion)_RUST_LINUX_X64'

- job: PackageRustWorker
  dependsOn: ['Build_RUST_LINUX_X64']
  templateContext:
    outputParentDirectory: $(Build.ArtifactStagingDirectory)
    outputs:
      - output: pipelineArtifact
        targetPath: $(Build.ArtifactStagingDirectory)
        artifactName: "RustPythonWorker"
  steps:
  - bash: |
      echo "Releasing from $BUILD_SOURCEBRANCHNAME"
      NUSPEC="eng\pack\Microsoft.Azure.Functions.RustPythonWorker.nuspec"
      VERSION=$(cat runtimes/v2/azure_functions_runtime/version.py | tail -1 | cut -d' ' -f3 | sed "s/'//g")
      if [[ $BUILD_SOURCEBRANCHNAME = rust/* ]]; then
        WKVERSION="${BUILD_SOURCEBRANCHNAME#rust/}"
      else
        WKVERSION="$VERSION-$(Build.BuildNumber)"
      fi
      echo "##vso[task.setvariable variable=nuspec_path]$NUSPEC"
      echo "##vso[task.setvariable variable=worker_version]$WKVERSION"
    displayName: "Generate Rust Worker NuGet Package for $BUILD_SOURCEBRANCHNAME"
  - task: DownloadPipelineArtifact@2
    inputs:
      buildType: 'current'
      targetPath: '$(Build.SourcesDirectory)'
  - task: ManifestGeneratorTask@0
    displayName: 'SBOM Generation Task'
    inputs:
      BuildDropPath: '$(Build.ArtifactStagingDirectory)'
      BuildComponentPath: '$(Build.SourcesDirectory)'
      Verbosity: 'Verbose'
  - task: CopyFiles@2
    inputs:
      SourceFolder: '$(Build.ArtifactStagingDirectory)'
      Contents: '**'
      TargetFolder: '$(Build.SourcesDirectory)'
  - task: NuGetCommand@2
    inputs:
      command: pack
      packagesToPack: '$(nuspec_path)'
      packDestination: $(Build.ArtifactStagingDirectory)
      versioningScheme: 'byEnvVar'
      versionEnvVar: WORKER_VERSION
